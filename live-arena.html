<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dart Lions Gräfenberg | Live-Arena</title>
<style>
:root{color-scheme:dark;--bg:#090e16;--panel:#151e2c;--edge:#354053;--gold:#f2c35d;--muted:#a7b3c4;--red:#ed535c;--green:#5de0a2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#2c1820 0,#0d1320 35%,var(--bg) 90%);font:16px system-ui,-apple-system,Segoe UI,sans-serif;color:white;min-height:100vh}.wrap{max-width:1450px;margin:auto;padding:22px 17px 42px}.header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;border-bottom:1px solid #4a3941;padding-bottom:21px}.brand{display:flex;align-items:center;gap:14px}.logo{height:77px;width:77px;object-fit:contain}.eyebrow{color:var(--gold);letter-spacing:.18em;font-size:12px;font-weight:800}.header h1{font-size:clamp(26px,4vw,44px);margin:2px 0;line-height:1.1;text-transform:uppercase}.meta{font-size:14px;color:var(--muted)}.status{display:flex;align-items:center;gap:9px;border:1px solid var(--edge);background:#131b29;padding:10px 14px;border-radius:25px;font-size:13px}.dot{background:#97a1b2;width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}.dot.live{background:var(--green);box-shadow:0 0 12px var(--green)}.dot.error{background:var(--red)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin:20px 0 23px}.section-heading{font-size:20px;font-weight:850}.small{color:var(--muted);font-size:13px}.action{background:#222e41;color:#fff;border:1px solid #536075;border-radius:8px;padding:9px 13px;font:inherit;font-size:13px;cursor:pointer}.action:hover{background:#344159}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}@media(max-width:800px){.grid{grid-template-columns:1fr}}.game{border:1px solid #4b3b36;background:linear-gradient(145deg,#222a39,#111a2a);border-radius:15px;overflow:hidden;box-shadow:0 8px 25px #0004}.game-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:#070e19;border-bottom:2px solid #d4a545}.board{font-size:14px;font-weight:900;color:var(--gold);letter-spacing:.08em}.live-tag{font-size:11px;font-weight:900;letter-spacing:.1em;color:var(--green)}.player{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:13px;align-items:center;padding:13px 15px;min-height:87px;border-bottom:1px solid #ffffff18}.player.active{background:#45351d6b}.portrait{height:57px;width:57px;object-fit:cover;border-radius:9px;border:1px solid #77684f;background:#273244;display:grid;place-items:center;color:var(--gold);font-size:26px;font-weight:900}.person-name{font-size:clamp(17px,2.5vw,21px);font-weight:850;overflow-wrap:anywhere}.person-sub{font-size:12px;color:var(--muted);margin-top:4px}.player-records{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.record-pill{display:inline-flex;gap:5px;align-items:center;background:#0b1422;border:1px solid #4a4650;border-radius:7px;padding:5px 8px;font-size:11px;color:#d9e1ee}.record-pill b{color:var(--gold);font-size:12px}.points{text-align:right}.rest{font-size:clamp(30px,4vw,42px);font-weight:950;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}.points-label{font-size:10px;color:var(--muted);letter-spacing:.09em;margin-top:5px}.game-foot{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;gap:10px}.leg-number{font-size:20px;font-weight:900}.leg-caption{font-size:11px;color:var(--muted);letter-spacing:.1em}.empty{padding:50px 22px;text-align:center;background:#151e2b;border:1px solid var(--edge);border-radius:15px;max-width:850px;margin:auto}.empty strong{display:block;font-size:22px;margin-bottom:12px}.empty p{color:var(--muted);line-height:1.65}.foot{border-top:1px solid #354053;margin-top:26px;padding-top:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px}a{color:var(--gold)}.error-note{margin-top:13px;font-size:13px;color:#f0b2b2;overflow-wrap:anywhere}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:480px){.wrap{padding:15px 10px}.logo{height:60px;width:60px}.player{grid-template-columns:49px minmax(0,1fr) auto;gap:9px;padding:12px}.portrait{height:49px;width:49px}}
</style>
</head><body>
<div class="wrap">
<header class="header"><div class="brand"><img class="logo" src="logos/dart-lions.PNG" alt="Dart Lions Logo" onerror="this.style.display='none'"><div><div class="eyebrow">DART LIONS GRÄFENBERG</div><h1>Live-Arena</h1><div class="meta" id="turnier">Darthelfer Live-Scoring</div></div></div><div class="status"><span class="dot" id="dot"></span><span id="status">Verbindung wird vorbereitet …</span></div></header>
<div class="toolbar"><div><div class="section-heading">Aktuelle Begegnungen</div><div class="small" id="updated">Warte auf Daten</div></div><button type="button" class="action" id="refresh">Neu verbinden</button></div>
<main id="content" aria-live="polite"><div class="empty"><strong>Verbinde mit Darthelfer …</strong><p>Die aktuellen Begegnungen werden automatisch geladen.</p></div></main>
<footer class="foot"><div><span id="source">Öffentliche Darthelfer-Live-Daten</span> · <a id="dartlink" href="https://www.darthelfer.de/public/eventoperator/7a088d28-63ee-49ac-a1fc-fe726056ddbe" target="_blank" rel="noopener noreferrer">Darthelfer öffnen</a></div><div>Game On!</div></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script>
'use strict';
// Spielerfotos: Freigegebene Fotos unter spielerbilder/NAME.jpg ablegen und hier zuweisen.
// Beispiel: 'Max Mustermann': 'spielerbilder/max-mustermann.jpg'
const SPIELERFOTOS = {};
const ORGANIZER = '7a088d28-63ee-49ac-a1fc-fe726056ddbe';
const TESTTURNIER = '58d419d4-91e7-436f-9a29-5e298c3e8ebf';
const BASE = 'https://www.darthelfer.de';
const PARAMS = new URLSearchParams(location.search);
// Im Testmodus: ?test=1 ; bestimmtes Turnier: ?turnier=UUID
const explicitTournament = PARAMS.get('turnier') || (PARAMS.get('test') === '1' ? TESTTURNIER : '');
const $ = id => document.getElementById(id);
let client=null, sock=null, reconnect=null, discovery=null, generation=0, activeTournament='', lastPacket=0, connected=false, gotData=false;
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setStatus(message,mode=''){ $('status').textContent=message; $('dot').className='dot '+mode; }
function empty(title,body,error=''){ $('content').innerHTML=`<div class="empty"><strong>${esc(title)}</strong><p>${esc(body)}</p>${error?`<div class="error-note">${esc(error)}</div>`:''}</div>`; }
function photo(name){const src=SPIELERFOTOS[name];if(!src)return `<div class="portrait" aria-label="Kein Spielerfoto hinterlegt">${esc((name||'?').trim().charAt(0).toUpperCase())}</div>`;return `<img class="portrait" src="${esc(src)}" alt="Foto ${esc(name)}" onerror="this.outerHTML='<div class=&quot;portrait&quot;>👤</div>'">`;}
function player(g,i){
 const name=g[`spieler${i}Name`]||'Unbekannt',id=g[`spieler${i}Id`],active=g.spielerIdActive===id||g.spielerIdAktiv===id;
 const togo=g[`spieler${i}Togo`],av=g[`spieler${i}Average`],last=g[`spieler${i}LastThrow`],count=g[`spieler${i}Count180er`];
 // Darthelfer sendet diese Werte als spieler1Best/spieler2Best bzw. spieler1HighOut/spieler2HighOut.
 // Nicht vorhandene Bestleistungen bewusst als Strich anzeigen (nicht mit 0 verwechseln).
 const best=g[`spieler${i}Best`],highFinish=g[`spieler${i}HighOut`];
 const shortest=(best===null||best===undefined||best==='')?'–':esc(best)+' Darts';
 const finish=(highFinish===null||highFinish===undefined||highFinish==='')?'–':esc(highFinish);
 return `<div class="player${active?' active':''}">${photo(name)}<div><div class="person-name">${active?'➤ ':''}${esc(name)}</div><div class="person-sub">Ø ${esc(av??'–')} · Letzte Aufnahme ${esc(last??'–')}</div><div class="player-records"><span class="record-pill">Kürzestes Leg <b>${shortest}</b></span><span class="record-pill">Highfinish <b>${finish}</b></span><span class="record-pill">180er <b>${esc(count??'0')}</b></span></div></div><div class="points"><div class="rest">${esc(togo??'–')}</div><div class="points-label">RESTSCORE</div></div></div>`;
}
function render(infos){ const items=Array.isArray(infos)?infos:[];const current=items.filter(g=>g&&!g.abgeschlossen&&!g.startssoon);if(!current.length){empty('Aktuell keine laufenden Spiele','Sobald Darthelfer Live-Spielstände sendet, erscheinen die Boards hier automatisch.');return;}
 current.sort((a,b)=>String(a.boardName??'').localeCompare(String(b.boardName??''),'de',{numeric:true}));
 $('content').innerHTML=`<div class="grid">${current.map(g=>`<article class="game"><div class="game-head"><span class="board">${esc(g.boardName||'BOARD')}</span><span class="live-tag">● ${g.inGame?'IM SPIEL':'LIVE-DATEN'}</span></div>${player(g,1)}${player(g,2)}<div class="game-foot"><div><div class="leg-caption">GEWONNENE LEGS</div><div class="leg-number">${esc(g.spieler1Legs??0)} : ${esc(g.spieler2Legs??0)}</div></div><div style="text-align:right"><div class="leg-caption">SPIELMODUS</div><div>${esc(g.bestOfLegs?'Best of '+g.bestOfLegs:'501 Double Out')}</div></div></div></article>`).join('')}</div>`;
}
function disconnect(){generation++;clearTimeout(reconnect);if(client){try{client.disconnect(()=>{});}catch(e){}}if(sock){try{sock.close();}catch(e){}}client=null;sock=null;connected=false;gotData=false;}
function connect(tournamentId,name){disconnect();const mine=generation;activeTournament=tournamentId;$('turnier').textContent=name||'Darthelfer-Turnier';$('dartlink').href=`${BASE}/public/tournament/${encodeURIComponent(tournamentId)}?app=false`;empty('Verbindung wird hergestellt','Die Live-Daten werden direkt bei Darthelfer abonniert.');setStatus('Verbinde …');
 if(typeof SockJS==='undefined'||typeof Stomp==='undefined'){setStatus('Bibliothek nicht geladen','error');empty('Verbindung nicht möglich','Die notwendigen JavaScript-Bibliotheken konnten nicht geladen werden.','Bitte Internetverbindung bzw. Script-Blocker prüfen.');return;}
 try{sock=new SockJS(BASE+'/api/websocket');client=Stomp.over(sock);client.debug=()=>{};client.heartbeat.outgoing=0;client.heartbeat.incoming=0;
 client.connect({},()=>{if(mine!==generation)return;connected=true;setStatus('Mit Darthelfer verbunden','live');$('updated').textContent='Verbunden · warte auf Live-Spielstände';
 client.subscribe('/topic/public/tournament/game/infos/'+tournamentId,msg=>{if(mine!==generation)return;try{const data=JSON.parse(msg.body),list=data.gameShortInfos;if(Array.isArray(list)){gotData=true;lastPacket=Date.now();render(list);$('updated').textContent='Letzte Meldung: '+new Date().toLocaleTimeString('de-DE')+' Uhr';setStatus('Live-Daten empfangen','live');}}catch(e){console.warn('Unbekannte Darthelfer-Nachricht',e);}});
 client.subscribe('/topic/public/tournament/publicview/'+tournamentId,msg=>{if(mine!==generation)return;try{const data=JSON.parse(msg.body);const x=data.turnierMain||data.turnierGruppe;if(x&&x.bezeichnung)$('turnier').textContent=x.bezeichnung;}catch(e){}});
 },err=>{if(mine!==generation)return;connected=false;setStatus('Verbindung unterbrochen','error');$('updated').textContent='Automatischer Neuversuch';scheduleReconnect(mine);});
 sock.onclose=(()=>{const original=sock.onclose;return ev=>{if(typeof original==='function')original(ev);if(mine===generation){connected=false;setStatus('Verbindung unterbrochen','error');scheduleReconnect(mine);}}})();
 }catch(e){setStatus('Verbindung fehlgeschlagen','error');empty('Verbindung fehlgeschlagen','Der öffentliche WebSocket konnte nicht geöffnet werden.',e.message);scheduleReconnect(mine);}
}
function scheduleReconnect(mine){if(mine!==generation)return;clearTimeout(reconnect);reconnect=setTimeout(()=>{if(mine===generation)connect(activeTournament,$('turnier').textContent);},8000);}
async function findLive(){if(explicitTournament){connect(explicitTournament,PARAMS.get('test')==='1'?'Testturnier':'Darthelfer-Turnier');return;}
 setStatus('Suche laufende Turniere');try{const result=await fetch(BASE+'/api/public/eventoperator/'+ORGANIZER+'?t='+Date.now(),{cache:'no-store'});if(!result.ok)throw Error('HTTP '+result.status);const data=await result.json();const arr=Array.isArray(data.allTournamentsStarted)?data.allTournamentsStarted:[];
 const preferred=arr.find(t=>/competition|darts open|weihnacht/i.test(t.bezeichnung||''))||arr[0];if(preferred){if(activeTournament!==preferred.id||!connected)connect(preferred.id,preferred.bezeichnung);return;}
 if(activeTournament){disconnect();activeTournament='';}setStatus('Keine Competition live');$('turnier').textContent='Aktuell keine laufende Veranstaltung';$('updated').textContent='Turnierübersicht wird regelmäßig geprüft';empty('Momentan kein Turnier live','Sobald eine Darthelfer-Veranstaltung gestartet wird, erscheint sie hier automatisch.');
 }catch(e){if(activeTournament)return;setStatus('Turniersuche nicht verfügbar','error');empty('Live-Suche nicht erreichbar','Der Abruf der Darthelfer-Veranstalterübersicht wurde vom Browser blockiert oder ist nicht verfügbar.','Testlink: live-arena.html?test=1 · Details: '+e.message);}}
$('refresh').addEventListener('click',()=>{if(explicitTournament)connect(explicitTournament,$('turnier').textContent);else findLive();});
findLive();if(!explicitTournament)discovery=setInterval(findLive,60000);
</script>
</body></html>
