<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080d17;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}body{background:radial-gradient(ellipse at 45% -35%,#49202a 0,#141b29 43%,#080d17 95%)}button,select{font:inherit}button{cursor:pointer}.shell{max-width:1800px;margin:0 auto;padding:16px 19px 15px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:75px}.identity{display:flex;align-items:center;gap:13px;min-width:0}.logo{height:63px;width:63px;object-fit:contain;flex:none}.tag{color:var(--gold);letter-spacing:.18em;font-size:11px;font-weight:850}.heading{font-size:clamp(24px,2.6vw,40px);font-weight:950;letter-spacing:.03em;line-height:1.12}.state{display:flex;align-items:center;gap:9px;font-size:12px;color:#e8ecf4;background:#111c2a;border:1px solid #455365;border-radius:30px;padding:9px 13px;white-space:nowrap}.lamp{width:9px;height:9px;border-radius:50%;background:#a8b3c3}.lamp.ok{background:var(--green);box-shadow:0 0 10px #67e3ac}.lamp.fail{background:var(--red)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0 12px;flex-wrap:wrap}.controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.btn{background:#243048;border:1px solid #5a6274;border-radius:8px;color:#fff;padding:7px 11px;font-size:12px}.btn.active{background:#6c4720;border-color:#e9b751;color:#fff}.note{font-size:12px;color:var(--muted)}.event-bar{padding:8px 13px;background:linear-gradient(90deg,#4b2428,#1b2332);border:1px solid #7a4b3d;border-radius:11px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;gap:15px;min-height:49px}.event-title{font-size:clamp(15px,1.45vw,23px);font-weight:900;overflow-wrap:anywhere}.event-small{color:#ded2c5;font-size:11px}.match-score{display:flex;align-items:center;gap:9px;flex-shrink:0}.match-label{font-size:10px;color:var(--muted);text-align:right;line-height:1.2}.match-number{font-size:clamp(19px,2.15vw,30px);font-weight:950;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}.board-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.game{background:linear-gradient(155deg,#27303d 0%,#111a2a 82%);border:1px solid #665344;border-radius:12px;min-width:0;overflow:hidden;display:flex;flex-direction:column}.board-top{background:#0b1422;padding:6px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #c99c45}.board-title{font-size:13px;color:var(--gold);font-weight:950;letter-spacing:.08em}.board-live{font-size:10px;font-weight:850;color:var(--green)}.players{flex:1;display:flex;flex-direction:column;min-height:0}.player{display:grid;grid-template-columns:69px minmax(0,1fr) auto;gap:9px;align-items:center;padding:7px 10px;min-width:0;flex:1}.player+.player{border-top:1px solid #ffffff19}.player.active{background:linear-gradient(90deg,#78551f55,#17233622)}.portrait{width:64px;height:81px;border-radius:8px;object-fit:cover;object-position:center 25%;border:1px solid #8c7856;background:#263447}.player.active .portrait{border-color:var(--gold);box-shadow:0 0 8px #e5b95855}.pinfo{min-width:0}.pname{font-weight:900;font-size:clamp(14px,1.27vw,21px);line-height:1.1;overflow-wrap:anywhere}.psub{font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.stat{padding:3px 6px;background:#0b1523;border:1px solid #485062;border-radius:5px;font-size:9px;color:#bbc7d7;white-space:nowrap}.stat b{color:var(--gold);font-size:11px}.scores{display:flex;gap:7px;align-items:center;flex-shrink:0}.legs{text-align:center;background:#0c1727;border:1px solid #665641;border-radius:6px;padding:5px 6px;min-width:39px}.tiny{font-size:9px;letter-spacing:.06em;color:#a7b7cb}.legval{font-size:25px;font-weight:950;line-height:1.1}.restbox{text-align:right;min-width:56px}.rest{font-size:clamp(27px,2.8vw,42px);font-weight:950;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.05}.board-bottom{background:#0c1420;padding:4px 12px;display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}.placeholder{border-style:dashed;opacity:.68}.placeholder .players{align-items:center;justify-content:center;color:#9dacbe;font-size:14px;text-align:center;padding:15px}.blank{padding:35px 22px;border:1px solid #4e586c;border-radius:12px;background:#172033;text-align:center;color:#bcc9dc}.blank strong{display:block;font-size:21px;color:#fff;margin-bottom:10px}.bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:9px;color:var(--muted);font-size:10px}.bottom a{color:var(--gold)}

body.projector{height:100dvh;overflow:hidden}.projector .shell{height:100dvh;max-width:none;display:flex;flex-direction:column;padding:9px 17px 7px}.projector .top{min-height:58px;flex-shrink:0}.projector .logo{width:53px;height:53px}.projector .heading{font-size:30px}.projector .toolbar{margin:3px 0 6px;flex-shrink:0}.projector .event-area{flex-shrink:0}.projector .event-bar{padding:6px 12px;min-height:40px;margin-bottom:6px}.projector .event-title{font-size:clamp(16px,1.5vw,22px)}.projector .board-grid{flex:1;min-height:0;grid-template-rows:repeat(var(--rows,3),minmax(0,1fr));gap:7px}.projector .game{height:100%;min-height:0}.projector .board-top{padding:4px 9px}.projector .player{padding:4px 9px;grid-template-columns:clamp(42px,4.3vw,71px) minmax(0,1fr) auto;gap:7px}.projector .portrait{width:100%;height:clamp(45px,7.1vh,78px)}.projector .pname{font-size:clamp(13px,1.21vw,20px)}.projector .psub{margin-top:2px;font-size:10px}.projector .stats{margin-top:3px}.projector .stat{padding:2px 4px}.projector .board-bottom{padding:2px 9px}.projector .bottom{flex-shrink:0;padding-top:4px}
.projector.mode-competition .event-bar{margin-bottom:6px}.projector.mode-competition .player{grid-template-columns:clamp(40px,4vw,60px) minmax(0,1fr) auto}.projector.mode-competition .portrait{height:clamp(45px,6.7vh,73px)}.projector.mode-competition .rest{font-size:clamp(25px,2.3vw,38px)}
.projector.mode-single .portrait,.projector.mode-double .portrait{height:clamp(60px,13vh,125px)}.projector.mode-single .pname,.projector.mode-double .pname{font-size:clamp(17px,1.8vw,29px)}.projector.mode-single .rest,.projector.mode-double .rest{font-size:clamp(35px,3.3vw,58px)}
@media(max-width:780px){body.projector{height:auto;overflow:auto}.projector .shell{height:auto;min-height:100dvh}.board-grid,.projector .board-grid{grid-template-columns:1fr;grid-template-rows:none}.projector .game{min-height:230px}.player{grid-template-columns:68px minmax(0,1fr) auto}.toolbar{align-items:flex-start}.top{align-items:flex-start}.heading{font-size:26px}.event-bar{align-items:flex-start;flex-wrap:wrap}.projector .portrait{height:82px}}

/* Neue Beamer-Bühne: Jede Ligabegegnung erhält ihren eigenen Titel + die zugehörigen zwei Boards. */
.stage{display:flex;flex-direction:column;gap:10px;min-height:0;flex:1}

.stage.single-active .event-section .pname{font-size:clamp(21px,2vw,34px)}
.stage.single-active .event-section .rest{font-size:clamp(44px,5vw,76px)}

.stage .event-title{line-height:1.18}
.stage .board-top{flex-shrink:0}

.projector .stage.mode-double .event-section .stat{font-size:9px;padding:2px 4px}

@media(max-width:780px){.stage .board-grid,.projector .stage .board-grid{grid-template-columns:1fr;grid-template-rows:none!important}.stage.single-active .event-section .board-grid{grid-template-columns:1fr}.projector .stage.single-active .event-section .player{grid-template-columns:80px minmax(0,1fr) auto}.projector .stage.single-active .event-section .portrait{height:90px;width:76px}.event-section{flex:none}.stage .game{min-height:240px}.stage{height:auto!important}}

<body class="projector mode-competition">
<div class="shell">
<header class="top"><div class="identity"><img class="logo" src="logos/dart-lions.PNG" alt="Dart Lions Gräfenberg – Original-Logo"><div><div class="tag">DART LIONS GRÄFENBERG</div><div class="heading">LIVE-ARENA</div></div></div><div class="state"><span class="lamp" id="lamp"></span><span id="state">Suche Veranstaltungen …</span></div></header>
<div class="toolbar"><div class="controls"><button class="btn" data-mode="auto">Automatik</button><button class="btn" data-mode="single">Liga · 2 Boards</button><button class="btn" data-mode="double">Doppelheimspiel · 4 Boards</button><button class="btn" data-mode="competition">Competition · 6 Boards</button></div><div class="controls"><button class="btn" id="screen">⛶ Vollbild</button><button class="btn" id="reload">↻ Verbinden</button><button class="btn" id="league-data">Liga-Ergebnisse auslesen</button></div></div>
<main class="stage" id="stage" aria-live="polite"><div class="blank">Suche gestartete Darthelfer-Veranstaltungen …</div></main>
<footer class="bottom"><span id="updated">Verbindung wird vorbereitet</span><span>Öffentliche Darthelfer-Live-Daten · Game On!</span></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script>
'use strict';
// Freigegebene Spielerbilder bitte in GitHub unter spielerbilder/ ablegen und hier zuweisen.
// Beispiel: 'Max Mustermann': 'spielerbilder/max-mustermann.jpg'
const SPIELERFOTOS={};
const ORGANIZER='7a088d28-63ee-49ac-a1fc-fe726056ddbe';
const TEST='58d419d4-91e7-436f-9a29-5e298c3e8ebf';
const BASE='https://www.darthelfer.de';
const qs=new URLSearchParams(location.search);
const manualIds=(qs.get('spiele')||qs.get('turnier')||'').split(',').map(x=>x.trim()).filter(x=>/^[0-9a-f-]{36}$/i.test(x));
if(!manualIds.length&&qs.get('test')==='1')manualIds.push(TEST);
const modes=['auto','single','double','competition'];
let chosen=modes.includes(qs.get('modus'))?qs.get('modus'):'auto';
let events=[],subscriptions=new Map(),client=null,sock=null,timer=null,cycle=0,connected=false,prevKey='',lastMessage=0;
const byId=id=>document.getElementById(id);
const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const silhouette='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 300"><rect width="220" height="300" fill="#253247"/><circle cx="110" cy="95" r="49" fill="#9ba6b7"/><path d="M12 300c0-80 35-134 98-134s98 54 98 134" fill="#9ba6b7"/></svg>');
document.addEventListener('error',e=>{const x=e.target;if(x instanceof HTMLImageElement&&x.classList.contains('portrait')&&x.src!==silhouette)x.src=silhouette;},true);
function status(s,good=false,bad=false){byId('state').textContent=s;byId('lamp').className='lamp'+(good?' ok':bad?' fail':'');}
function league(e){return String(e?.turniersystem||'').toUpperCase()==='LIGASPIELTAG';}
function effectiveMode(){if(chosen!=='auto')return chosen;const n=events.filter(e=>league(e)).length;return n>=2?'double':n===1?'single':'competition';}
function chosenEvents(){const m=effectiveMode();const sorted=events.filter(league);if(m==='single')return sorted.slice(0,1);if(m==='double')return sorted.slice(0,2);return events.filter(e=>!league(e)).slice(0,1);}
function countPerEvent(){return effectiveMode()==='competition'?6:2;}
function classNames(){
 const m=effectiveMode();document.body.className='projector mode-'+m;
 document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===chosen));
}
function photo(name){const path=SPIELERFOTOS[name]||silhouette;return `<img class="portrait" src="${safe(path)}" alt="${safe(name)}" loading="eager">`;}
function player(g,n){
 const name=g[`spieler${n}Name`]||'Spieler', id=g[`spieler${n}Id`];
 const active=id&&(g.spielerIdActive===id||g.spielerIdAktiv===id);
 const value=g[`spieler${n}Togo`],legs=g[`spieler${n}Legs`],avg=g[`spieler${n}Average`];
 const last=g[`spieler${n}LastThrow`],best=g[`spieler${n}Best`],finish=g[`spieler${n}HighOut`],d180=g[`spieler${n}Count180er`];
 return `<div class="player${active?' active':''}">${photo(name)}<div class="pinfo"><div class="pname">${active?'➤ ':''}${safe(name)}</div><div class="psub">Ø ${safe(avg??'–')} · Letzte Aufnahme ${safe(last??'–')}</div><div class="stats"><span class="stat">Kürzestes Leg <b>${safe(best??'–')}${best!=null?' Darts':''}</b></span><span class="stat">Highfinish <b>${safe(finish??'–')}</b></span><span class="stat">180er <b>${safe(d180??0)}</b></span></div></div><div class="scores"><div class="legs"><div class="tiny">LEGS</div><div class="legval">${safe(legs??0)}</div></div><div class="restbox"><div class="rest">${safe(value??'–')}</div><div class="tiny">REST</div></div></div></div>`;
}
function card(g){
 const valid=g&&!g.placeholder;
 const title=valid?(g.boardName||'BOARD'):(g?.boardName||'BOARD FREI');
 if(!valid)return `<article class="game placeholder"><div class="board-top"><span class="board-title">${safe(title)}</span><span class="board-live">BEREIT</span></div><div class="players">Aktuell keine Begegnung auf diesem Board</div></article>`;
 return `<article class="game"><div class="board-top"><span class="board-title">${safe(title)}</span><span class="board-live">● ${g.inGame?'IM SPIEL':'LIVE-DATEN'}</span></div><div class="players">${player(g,1)}${player(g,2)}</div><div class="board-bottom"><span>501 DOUBLE OUT</span><span>${safe(g.bestOfLegs?'BEST OF '+g.bestOfLegs:'LIVE')}</span></div></article>`;
}
function eventName(e){return e?.data?.turnierMain?.bezeichnung||e?.bezeichnung||e?.data?.turnierGruppe?.bezeichnung||'Ligaspiel';}
function teamNames(e){
 const d=e?.data?.turnierMain||e?.data?.turnierGruppe||{};
 const home=typeof d.mannschaftHeim==='string'?d.mannschaftHeim:(d.mannschaftHeim?.name||d.mannschaftHeim?.bezeichnung);
 const away=typeof d.mannschaftGast==='string'?d.mannschaftGast:(d.mannschaftGast?.name||d.mannschaftGast?.bezeichnung);
 if(home&&away)return [home,away];
 const parts=eventName(e).split(/\s+(?:vs\.?|gegen|[-–])\s+/i);
 return parts.length===2?parts:[eventName(e),''];
}
// Nur eindeutig gewertete Einzelmatches aus dem Ligaspieltag zählen.
// Ohne überprüfbare Zuordnung der Heimmannschaft zu Spieler 1/2 NICHT raten.
function leagueScore(e){
 const d=e?.data?.turnierMain||e?.data?.turnierGruppe;
 if(!d)return null;
 let a=d.tournamentLeagueGameEntities;
 if(!Array.isArray(a)||!a.length)return null;
 // Eine automatische Zuordnung Spieler1=Heim ist für jedes Ligaformat NICHT garantiert.
 // Bis zur Prüfung eines echten Liga-Datensatzes bleibt der Mannschaftsstand deshalb offen.
 return null;
}
function visibleGames(e,max){
 const gs=(e?.games||[]).filter(g=>g&&!g.abgeschlossen&&!g.startssoon);
 gs.sort((a,b)=>String(a.boardName||'').localeCompare(String(b.boardName||''),'de',{numeric:true}));
 return gs.slice(0,max);
}
function placeholder(name){return {placeholder:true,boardName:name};}
function sectionHeader(e,m,i){
 if(m==='competition')return `<div class="event-bar"><div><div class="event-small">COMPETITION · LIVE</div><div class="event-title">${safe(e?eventName(e):'Aktuell keine Competition gestartet')}</div></div><div class="event-small">6 BOARDS · 501 DOUBLE OUT</div></div>`;
 if(!e)return `<div class="event-bar"><div><div class="event-small">${m==='double'?'LIGASPIEL '+(i+1):'LIGA'}</div><div class="event-title">Noch keine gestartete Ligabegegnung</div></div><div class="match-number">– : –</div></div>`;
 const teams=teamNames(e),score=leagueScore(e);
 return `<div class="event-bar"><div><div class="event-small">${m==='double'?'DOPPELHEIMSPIELTAG · SPIEL '+(i+1):'LIGA · HEIMSPIELTAG'}</div><div class="event-title">${safe(teams[0])}${teams[1]?' <span style="color:#d8b97f">vs.</span> '+safe(teams[1]):''}</div></div><div class="match-score"><div class="match-label">MANNSCHAFTS-<br>SPIELSTAND${score?'':'<br>(NOCH NICHT BESTÄTIGT)'}</div><div class="match-number">${score?score.home+' : '+score.away:'– : –'}</div></div></div>`;
}
function eventSection(e,m,i,allowExpand){
 const max=m==='competition'?6:2;
 let games=visibleGames(e,max);
 // Wenn nur ein reales Spiel aktiv ist, erhält es die volle verfügbare Breite.
 // Sobald alle Boards bespielt werden, stehen sie nebeneinander und in mehreren Reihen.
 if(!games.length){games=Array.from({length:max},(_,j)=>placeholder('BOARD '+(i*2+j+1)));}
 const count=games.length;
 const one=allowExpand&&count===1&&!!e;
 const rowCount=Math.max(1,Math.ceil(count/2));
 return `<section class="event-section${one?' has-one':''}">${sectionHeader(e,m,i)}<div class="board-grid" style="--rows:${rowCount}">${games.map(card).join('')}</div></section>`;
}
function render(){
 classNames();const m=effectiveMode(),selected=chosenEvents(),stage=byId('stage');
 let html='',one=false;
 if(m==='competition'){
  const e=selected[0];const gs=visibleGames(e,6);
  one=gs.length===1;
  html=eventSection(e,m,0,true);
 }else if(m==='single'){
  const e=selected[0];one=visibleGames(e,2).length===1;
  html=eventSection(e,m,0,true);
 }else{
  // Eindeutige Zuordnung: Mannschaftsspiel 1 hat sein eigenes Paar Boards + Titel,
  // Mannschaftsspiel 2 erhält darunter sein eigenes Paar Boards + Titel.
  html=eventSection(selected[0],m,0,false)+eventSection(selected[1],m,1,false);
 }
 stage.className='stage mode-'+m+(one?' single-active':'')+(m==='competition'?' competition':'');
 stage.innerHTML=html;
 byId('updated').textContent=(lastMessage?'Letzte Live-Meldung '+new Date(lastMessage).toLocaleTimeString('de-DE'):'Warte auf Live-Spielstände')+' · '+(m==='competition'?'Competition':m==='double'?'Doppelheimspieltag':'Einzelheimspieltag');
}
function close(){cycle++;clearTimeout(timer);if(client){try{client.disconnect(()=>{});}catch{}}if(sock){try{sock.close();}catch{}}client=null;sock=null;connected=false;subscriptions.clear();}
function rejoin(){const token=++cycle;clearTimeout(timer);if(client){try{client.disconnect(()=>{});}catch{}}if(sock){try{sock.close();}catch{}}subscriptions.clear();connected=false;client=null;sock=null;const ids=events.map(x=>x.id);if(!ids.length){render();status('Keine Veranstaltung live');return;}if(typeof SockJS==='undefined'||typeof Stomp==='undefined'){status('Live-Bibliothek nicht geladen',false,true);render();return;}
try{sock=new SockJS(BASE+'/api/websocket');client=Stomp.over(sock);client.debug=()=>{};client.heartbeat.outgoing=0;client.heartbeat.incoming=0;client.connect({},()=>{if(token!==cycle)return;connected=true;status('Live verbunden',true);for(const e of events){const id=e.id;const s1=client.subscribe('/topic/public/tournament/game/infos/'+id,msg=>{if(token!==cycle)return;try{const d=JSON.parse(msg.body);if(Array.isArray(d.gameShortInfos)){e.games=d.gameShortInfos;lastMessage=Date.now();render();status('Live-Daten empfangen',true);}}catch(err){console.warn('Game-Daten',err)}});const s2=client.subscribe('/topic/public/tournament/publicview/'+id,msg=>{if(token!==cycle)return;try{const d=JSON.parse(msg.body);e.data=d;lastMessage=Date.now();render();}catch(err){console.warn('Turnier-Daten',err)}});subscriptions.set(id,[s1,s2]);}render();},()=>{if(token!==cycle)return;connected=false;status('Verbindung unterbrochen',false,true);timer=setTimeout(rejoin,8000);});const original=sock.onclose;sock.onclose=ev=>{if(typeof original==='function')original(ev);if(token===cycle){connected=false;status('Verbindung unterbrochen',false,true);clearTimeout(timer);timer=setTimeout(rejoin,8000);}};}catch(err){status('Verbindung fehlgeschlagen',false,true);timer=setTimeout(rejoin,8000);}}
async function discover(){try{let active=[];if(manualIds.length){active=manualIds.map((id,i)=>({id,bezeichnung:qs.get('test')==='1'?'Testturnier':`Veranstaltung ${i+1}`,turniersystem:chosen==='single'||chosen==='double'?'LIGASPIELTAG':'SCHWEIZERSYSTEM'}));}else{const res=await fetch(BASE+'/api/public/eventoperator/'+ORGANIZER+'?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const d=await res.json();active=Array.isArray(d.allTournamentsStarted)?d.allTournamentsStarted:[];}
// Keine laufenden Events fallen nicht automatisch auf künftige oder bereits beendete Events zurück.
const selected=active.filter(x=>x&&x.id).sort((a,b)=>league(a)===league(b)?0:league(a)?-1:1);const key=selected.map(e=>e.id).join('|');if(key!==prevKey){prevKey=key;const old=new Map(events.map(e=>[e.id,e]));events=selected.map(e=>({...e,games:old.get(e.id)?.games||[],data:old.get(e.id)?.data||null}));rejoin();}else if(!connected&&events.length&&!timer)rejoin();else render();}catch(err){status('Turniersuche nicht erreichbar',false,true);byId('updated').textContent='Turniersuche fehlgeschlagen: '+err.message;render();}}
function setMode(m){chosen=m;qs.set('modus',m);history.replaceState(null,'',location.pathname+'?'+qs.toString());render();}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
// Einmaliger Datencheck aus einem bereits abgeschlossenen öffentlichen Ligaspiel.
// Es werden ausschließlich Spielinformationen und Feldnamen exportiert;
// keine Administratoren, Kontaktdaten, Turnierteilnehmerlisten oder Zugangsdaten.
byId('league-data').addEventListener('click',async()=>{
 const btn=byId('league-data');const old=btn.textContent;
 btn.disabled=true;btn.textContent='Lade Ligadaten …';
 try{
  const chosenLeague=events.find(e=>league(e));
  const id=chosenLeague?.id||'aa3b0e5b-3cc0-4e09-a05f-454e87c5b7df';
  const r=await fetch(BASE+'/api/public/tournament/'+id+'?t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw Error('Darthelfer HTTP '+r.status);
  const d=await r.json();
  const main=d.turnierMain||d.turnierGruppe||{};
  const entries=main.tournamentLeagueGameEntities||[];
  const results=main.tournamentErgebnisEntities||[];
  // Nur Daten für die korrekte Spielauswertung: Ergebnisse, Matchkennungen,
  // Zuordnung zu Heim/Gast. Keine Kontakt- oder Administratordaten.
  const players=Array.isArray(main.tournamentPlayerEntities)?main.tournamentPlayerEntities:[];
  const out={
   hinweis:'Öffentliche Liga-Spielauswertung. Keine E-Mail-Adressen, Telefonnummern oder Admin-Daten.',
   tournamentId:id,
   turnierName:main.bezeichnung||chosenLeague?.bezeichnung||null,
   turniersystem:main.turniersystem||null,
   mannschaftHeim:main.mannschaftHeim||null,
   mannschaftGast:main.mannschaftGast||null,
   keysLigaSpiel:entries[0]?Object.keys(entries[0]):[],
   ligaSpiele:entries.map(x=>({
    id:x.id,gameId:x.gameId,ligaSpielId:x.ligaSpielId,type:x.type,bereich:x.bereich,counter:x.counter,
    complete:x.complete,anzahlPlayer1:x.anzahlPlayer1,anzahlPlayer2:x.anzahlPlayer2,
    player1Id:x.player1Id,player2Id:x.player2Id,
    doppelpartner1Player1Id:x.doppelpartner1Player1Id,doppelpartner1Player2Id:x.doppelpartner1Player2Id,
    doppelpartner2Player1Id:x.doppelpartner2Player1Id,doppelpartner2Player2Id:x.doppelpartner2Player2Id,
    ergebnisVomScorer:x.ergebnisVomScorer,
    paarkreuzwertHeim1:x.paarkreuzwertHeim1,paarkreuzwertGast1:x.paarkreuzwertGast1,
    paarkreuzwertHeim2:x.paarkreuzwertHeim2,paarkreuzwertGast2:x.paarkreuzwertGast2
   })),
   keysErgebnis:results[0]?Object.keys(results[0]):[],
   ergebnisse:results.map(x=>({
    id:x.id,gameId:x.gameId,ligaSpielId:x.ligaSpielId,
    player1Id:x.player1Id,player2Id:x.player2Id,
    spieler1Id:x.spieler1Id,spieler2Id:x.spieler2Id,
    anzahlPlayer1:x.anzahlPlayer1,anzahlPlayer2:x.anzahlPlayer2,
    anzahlSpieler1:x.anzahlSpieler1,anzahlSpieler2:x.anzahlSpieler2,
    complete:x.complete,type:x.type
   })),
   spielerZuordnung:players.map(p=>({
    id:p.id,idShort:p.idShort,name:p.name,heimmannschaft:p.heimmannschaft,
    vereinsname:p.vereinsname,
    // Player classification available as boolean or as explicit field?
    mannschaft:p.mannschaft||null
   })),
   allgemeineErgebnisFelder:Object.keys(main).filter(k=>/ergebnis|result|score|spielstand|punkt|stand|heim|gast/i.test(k))
  };
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='dart-lions-liga-datencheck.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);
  status('Liga-Datencheck heruntergeladen',true);
 }catch(e){status('Liga-Datencheck: '+e.message,false,true);alert('Datencheck nicht möglich: '+e.message);}
 finally{btn.disabled=false;btn.textContent=old;}
});
byId('reload').addEventListener('click',()=>{if(events.length)rejoin();else discover();});
byId('screen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{}});
discover();if(!manualIds.length)setInterval(discover,60000);
</script>
