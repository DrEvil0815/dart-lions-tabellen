
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dart Lions III – Spielplan und Ergebnisse</title>

<style>
:root {
  --bg: #121827;
  --card: #252d3d;
  --gold: #d5a53b;
  --gold-light: #f0c45a;
  --text: #ffffff;
  --muted: #b9c5d5;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 10px 7px;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

.container {
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
}

h1 {
  color: var(--gold);
  text-align: center;
  font-size: clamp(17px, 4vw, 23px);
  margin: 5px 0 7px;
  line-height: 1.25;
}

.subtitle {
  color: var(--muted);
  font-size: 12px;
  text-align: center;
  margin: 0 0 18px;
}

h2 {
  color: var(--gold);
  font-size: 15px;
  margin: 20px 0 10px;
  line-height: 1.3;
}

/* Spielkarten */

.match-card {
  background: linear-gradient(
    135deg,
    #293244,
    #1a2030
  );
  border: 1px solid #876628;
  border-radius: 12px;
  padding: 16px 12px;
  margin-bottom: 15px;
}

.card-label {
  color: var(--gold-light);
  font-size: 11px;
  font-weight: bold;
  text-align: center;
  letter-spacing: 1px;
}

.card-date {
  color: var(--muted);
  text-align: center;
  font-size: 12px;
  margin-top: 7px;
}

/* Mannschaften und Originalwappen */

.scoreboard {
  display: grid;
  grid-template-columns:
    minmax(0, 1fr)
    auto
    minmax(0, 1fr);
  align-items: center;
  gap: 8px;
  margin: 16px 0 10px;
}

.club {
  min-width: 0;
  text-align: center;
}

.club-logo {
  display: block;
  width: 64px;
  height: 64px;
  object-fit: contain;
  margin: 0 auto 8px;
}

.logo-placeholder {
  width: 64px;
  height: 64px;
  border: 1px solid #667184;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  margin: 0 auto 8px;
  padding: 5px;
  color: var(--muted);
  font-size: 9px;
}

.club-name {
  font-size: 12px;
  font-weight: bold;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.score {
  color: var(--gold-light);
  font-weight: 900;
  font-size: clamp(28px, 7vw, 40px);
  white-space: nowrap;
  text-align: center;
}

/* Nächstes Ligaspiel - kleinere Karte */

.next-card {
  padding: 11px 10px;
  border: 1px solid var(--gold);
  background: linear-gradient(
    135deg,
    #2c2b28,
    #1b2231
  );
}

.next-card .scoreboard {
  margin: 10px 0 6px;
  gap: 6px;
}

.next-card .club-logo,
.next-card .logo-placeholder {
  width: 43px;
  height: 43px;
  margin-bottom: 5px;
}

.next-card .club-name {
  font-size: 11px;
}

.next-card .vs {
  font-size: 22px;
}

.next-card .card-date {
  margin-top: 5px;
}

.match-time {
  color: var(--gold-light);
  font-size: 12px;
  font-weight: bold;
  text-align: center;
  margin-top: 8px;
}

/* Letztes Ligaspiel */

.latest-card .club-logo,
.latest-card .logo-placeholder {
  width: 68px;
  height: 68px;
}

.latest-card .scoreboard {
  margin: 16px 0 10px;
}

/* Spielbericht */

.report-link {
  display: block;
  text-align: center;
  color: var(--gold-light);
  font-size: 12px;
  font-weight: bold;
  text-decoration: none;
  margin-top: 12px;
}

.report-link:hover,
.history-link:hover {
  text-decoration: underline;
}

/* Weitere Ergebnisse */

.history {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.history-item {
  background: var(--card);
  border-left: 3px solid var(--gold);
  border-radius: 9px;
  padding: 12px 10px;
}

/* Datum oben mittig */

.history-date {
  color: var(--muted);
  font-size: 11px;
  text-align: center;
}

/* Ergebnis exakt zwischen den Wappen */

.history-item .scoreboard {
  grid-template-columns:
    minmax(0, 1fr)
    auto
    minmax(0, 1fr);
  align-items: center;
  gap: 8px;
  margin: 12px 0 8px;
}

.history-item .club-logo,
.history-item .logo-placeholder {
  width: 43px;
  height: 43px;
  margin-bottom: 6px;
}

.history-item .club-name {
  font-size: 11px;
}

.history-item .score {
  font-size: 30px;
}

.history-link {
  color: var(--gold-light);
  font-size: 11px;
  text-decoration: none;
  display: block;
  text-align: center;
  margin-top: 8px;
}

/* Status und Datenstand */

.status {
  text-align: center;
  color: var(--muted);
  padding: 18px 10px;
  font-size: 12px;
}

.footer {
  margin-top: 18px;
  color: #9ba8bb;
  font-size: 10px;
  text-align: center;
}

/* Für schmale Homepage-Spalten */

@media (max-width: 440px) {

  body {
    padding: 8px 5px;
  }

  h1 {
    font-size: 18px;
  }

  .match-card {
    padding: 12px 7px;
  }

  .scoreboard {
    gap: 5px;
  }

  .club-name {
    font-size: 10px;
  }

  .latest-card .club-logo,
  .latest-card .logo-placeholder {
    width: 48px;
    height: 48px;
  }

  .next-card .club-logo,
  .next-card .logo-placeholder {
    width: 36px;
    height: 36px;
  }

  .next-card .club-name {
    font-size: 10px;
  }

  .score {
    font-size: 29px;
  }

  .next-card .vs {
    font-size: 20px;
  }

  .history-item .club-logo,
  .history-item .logo-placeholder {
    width: 35px;
    height: 35px;
  }

  .history-item .club-name {
    font-size: 10px;
  }

  .history-item .score {
    font-size: 25px;
  }

  .history-item .scoreboard {
    gap: 5px;
  }
}

</style>
</head>

<body>

<div class="container">

  <h1>DART LIONS III</h1>

  <p class="subtitle">
    Spielplan &amp; Ergebnisse · Saison 2026/27
  </p>

  <!-- Nächstes Ligaspiel -->

  <div id="next-match"></div>

  <!-- Letztes Ligaspiel -->

  <h2>LETZTES LIGASPIEL</h2>

  <div id="latest" class="status">
    Spielergebnisse werden geladen ...
  </div>

  <!-- Weitere Ergebnisse -->

  <h2>WEITERE ERGEBNISSE</h2>

  <div id="history" class="history"></div>

  <div id="footer" class="footer"></div>

</div>

<script>
"use strict";

/* Automatisch aktualisierte NuLiga-Daten */

const DATA_URL = "./data/ergebnisse-iii.json";

/* Originalwappen aller Mannschaften */

const LOGOS = {

  "Dart Lions Gräfenberg III":
    "./logos/dart-lions.PNG",

  "Bollnberch Bomber Maigisch II":
    "./logos/bollnberch.png",

  "Dartclub Steinbach":
    "./logos/steinbach.png",

  "DC Gallier Pettensiedel":
    "./logos/pettensiedel.png",

  "SV Hetzles II":
    "./logos/hetzles.png",

  'DJK "Creek Steelers" Wimmelbach IV':
    "./logos/wimmelbach.png",

  "Spickersportclub Pinzberg":
    "./logos/pinzberg.jpg",

  "DC Full Bulls Neunkirchen":
    "./logos/neunkirchen.png"

};

/* HTML-Element erstellen */

function create(tag, className, text) {

  const element = document.createElement(tag);

  if (className) {
    element.className = className;
  }

  if (text !== undefined && text !== null) {
    element.textContent = String(text);
  }

  return element;
}

/* Originalwappen einfügen */

function addLogo(container, teamName) {

  const logoUrl = LOGOS[teamName];

  if (!logoUrl) {

    container.appendChild(
      create(
        "div",
        "logo-placeholder",
        "Vereinswappen"
      )
    );

    return;
  }

  const image = document.createElement("img");

  image.className = "club-logo";
  image.src = logoUrl;
  image.alt = "Wappen " + teamName;
  image.loading = "lazy";

  image.onerror = function() {

    const placeholder = create(
      "div",
      "logo-placeholder",
      "Wappen nicht geladen"
    );

    image.replaceWith(placeholder);
  };

  container.appendChild(image);
}

/* Mannschaft mit Wappen erstellen */

function createClub(teamName) {

  const club = create("div", "club");

  addLogo(club, teamName);

  club.appendChild(
    create("div", "club-name", teamName)
  );

  return club;
}

/* Link zum NuLiga-Spielbericht */

function createReportLink(spiel, className) {

  if (!spiel.spielbericht) {
    return null;
  }

  let url;

  try {
    url = new URL(spiel.spielbericht);
  } catch (error) {
    return null;
  }

  if (
    url.protocol !== "http:" &&
    url.protocol !== "https:"
  ) {
    return null;
  }

  const link = create(
    "a",
    className,
    "Spielbericht ansehen"
  );

  link.href = url.href;
  link.target = "_blank";
  link.rel = "noopener noreferrer";

  return link;
}

/* Nächstes Ligaspiel */

function showNextMatch(spiel) {

  const container =
    document.getElementById("next-match");

  container.replaceChildren();

  if (!spiel || !spiel.heim || !spiel.gast) {
    return;
  }

  const card = create(
    "div",
    "match-card next-card"
  );

  card.appendChild(
    create(
      "div",
      "card-label",
      "NÄCHSTES LIGASPIEL"
    )
  );

  card.appendChild(
    create(
      "div",
      "card-date",
      spiel.datum || ""
    )
  );

  const board = create("div", "scoreboard");

  board.appendChild(
    createClub(spiel.heim)
  );

  board.appendChild(
    create("div", "score vs", "VS")
  );

  board.appendChild(
    createClub(spiel.gast)
  );

  card.appendChild(board);

  if (spiel.uhrzeit) {

    card.appendChild(
      create(
        "div",
        "match-time",
        "Spielbeginn: " + spiel.uhrzeit
      )
    );
  }

  container.appendChild(card);
}

/* Letztes abgeschlossenes Ligaspiel */

function showLatest(spiel) {

  const container =
    document.getElementById("latest");

  container.className =
    "match-card latest-card";

  container.replaceChildren();

  container.appendChild(
    create(
      "div",
      "card-date",
      spiel.datum
    )
  );

  const board = create("div", "scoreboard");

  board.appendChild(
    createClub(spiel.heim)
  );

  board.appendChild(
    create(
      "div",
      "score",
      spiel.ergebnis
    )
  );

  board.appendChild(
    createClub(spiel.gast)
  );

  container.appendChild(board);

  const report = createReportLink(
    spiel,
    "report-link"
  );

  if (report) {
    container.appendChild(report);
  }
}

/*
  Weitere Ergebnisse:
  Datum oben.
  Heimwappen links.
  Ergebnis mittig.
  Gastwappen rechts.
*/

function showHistory(spiele) {

  const container =
    document.getElementById("history");

  container.replaceChildren();

  if (spiele.length === 0) {

    container.appendChild(
      create(
        "div",
        "status",
        "Noch keine weiteren Ergebnisse."
      )
    );

    return;
  }

  for (const spiel of spiele) {

    const item = create(
      "div",
      "history-item"
    );

    item.appendChild(
      create(
        "div",
        "history-date",
        spiel.datum
      )
    );

    const board = create(
      "div",
      "scoreboard"
    );

    /* Heimmannschaft links */

    board.appendChild(
      createClub(spiel.heim)
    );

    /* Ergebnis exakt in der Mitte */

    board.appendChild(
      create(
        "div",
        "score",
        spiel.ergebnis
      )
    );

    /* Gastmannschaft rechts */

    board.appendChild(
      createClub(spiel.gast)
    );

    item.appendChild(board);

    /* Direkter Spielbericht */

    const report = createReportLink(
      spiel,
      "history-link"
    );

    if (report) {
      item.appendChild(report);
    }

    container.appendChild(item);
  }
}

/* Ergebnisse automatisch laden */

async function loadResults() {

  const latest =
    document.getElementById("latest");

  try {

    const response = await fetch(
      DATA_URL,
      { cache: "no-store" }
    );

    if (!response.ok) {

      throw new Error(
        "JSON-Datei nicht erreichbar: " +
        response.status
      );
    }

    const data = await response.json();

    if (!Array.isArray(data.spiele)) {

      throw new Error(
        "Ungültige Ergebnisdaten"
      );
    }

    /* Nächstes Ligaspiel */

    showNextMatch(
      data.naechstes_spiel
    );

    /* Abgeschlossene Spiele sortieren */

    const spiele = data.spiele
      .filter(function(spiel) {

        return (
          spiel &&
          spiel.datum_iso &&
          spiel.heim &&
          spiel.gast &&
          spiel.ergebnis
        );

      })
      .sort(function(a, b) {

        return b.datum_iso.localeCompare(
          a.datum_iso
        );

      });

    if (spiele.length > 0) {

      showLatest(spiele[0]);

      showHistory(
        spiele.slice(1)
      );

    } else {

      latest.textContent =
        "Noch keine abgeschlossenen Ligaspiele.";

      showHistory([]);
    }

    /* Letzter Datenabruf */

    if (data.stand) {

      const date = new Date(
        data.stand
      );

      if (!isNaN(date.getTime())) {

        document.getElementById(
          "footer"
        ).textContent =
          "Datenstand: " +
          date.toLocaleString(
            "de-DE",
            {
              timeZone:
                "Europe/Berlin"
            }
          );
      }
    }

  } catch(error) {

    latest.textContent =
      "Spielergebnisse momentan nicht verfügbar.";

    console.error(
      "Dart Lions III:",
      error
    );
  }
}

/* Anzeige starten */

loadResults();

</script>

</body>
</html>
