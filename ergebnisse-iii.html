
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dart Lions III – Spielergebnisse</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px 16px;
  background: #121827;
  color: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
}

.container {
  max-width: 950px;
  margin: 0 auto;
}

h1 {
  color: #d5a53b;
  text-align: center;
  font-size: clamp(23px, 4vw, 34px);
  margin: 0 0 12px;
}

.subtitle {
  color: #bfc8d6;
  text-align: center;
  margin-bottom: 32px;
}

h2 {
  font-size: 21px;
  color: #d5a53b;
  margin: 32px 0 16px;
}

.latest {
  padding: 25px 18px;
  border: 1px solid #9b762d;
  border-radius: 16px;
  background: linear-gradient(135deg, #293244, #191f2e);
}

.label {
  text-align: center;
  color: #f0c45a;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 2px;
}

.match-date {
  text-align: center;
  color: #bac4d3;
  margin-top: 10px;
}

.scoreboard {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  gap: 12px;
  align-items: center;
  margin: 25px 0;
}

.club {
  text-align: center;
  min-width: 0;
}

.club-logo {
  display: block;
  width: 90px;
  height: 90px;
  object-fit: contain;
  margin: 0 auto 14px;
}

.logo-placeholder {
  width: 90px;
  height: 90px;
  margin: 0 auto 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #596274;
  border-radius: 50%;
  font-size: 12px;
  color: #aab4c4;
}

.club-name {
  font-size: 17px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.score {
  font-size: clamp(30px, 6vw, 58px);
  font-weight: 900;
  color: #f0c45a;
  white-space: nowrap;
}

.report-link {
  display: block;
  text-align: center;
  margin-top: 18px;
  color: #f0c45a;
  font-weight: bold;
  text-decoration: none;
}

.report-link:hover {
  text-decoration: underline;
}

.history {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.history-item {
  padding: 18px;
  border-radius: 10px;
  background: #252d3d;
  border-left: 3px solid #d5a53b;
}

.history-top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
}

.history-date {
  font-size: 13px;
  color: #afbbcc;
}

.history-teams {
  margin: 10px 0;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.history-score {
  color: #f0c45a;
  font-size: 25px;
  font-weight: bold;
  white-space: nowrap;
}

.history-link {
  color: #f0c45a;
  font-size: 13px;
}

.status {
  text-align: center;
  color: #afbbcc;
  padding: 20px;
}

.footer {
  margin-top: 28px;
  text-align: center;
  color: #929fb3;
  font-size: 12px;
}

@media (max-width: 600px) {
  body {
    padding: 15px 10px;
  }

  .latest {
    padding: 20px 10px;
  }

  .scoreboard {
    gap: 6px;
  }

  .club-logo,
  .logo-placeholder {
    width: 60px;
    height: 60px;
  }

  .club-name {
    font-size: 12px;
  }

  .history-top {
    align-items: flex-start;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>DART LIONS GRÄFENBERG III</h1>

  <p class="subtitle">
    Ligaergebnisse – Saison 2026/27
  </p>

  <div id="latest" class="status">
    Spielergebnisse werden geladen ...
  </div>

  <h2>WEITERE SPIELERGEBNISSE</h2>

  <div id="history" class="history"></div>

  <div id="footer" class="footer"></div>

</div>

<script>
"use strict";

const DATA_URL = "./data/ergebnisse-iii.json";


const LOGOS = {
  "Dart Lions Gräfenberg III":
    "./logos/dart-lions.PNG",

  "Bollnberch Bomber Maigisch II":
    "./logos/bollnberch.png"
};


// Hier können wir später die Originalwappen
// unserer Gegner ergänzen.

function create(tag, className, text) {
  const element = document.createElement(tag);

  if (className) {
    element.className = className;
  }

  if (text !== undefined && text !== null) {
    element.textContent = String(text);
  }

  return element;
}

function addLogo(container, teamName) {
  const logoUrl = LOGOS[teamName];

  if (!logoUrl) {
    const placeholder = create(
      "div",
      "logo-placeholder",
      "Vereinswappen"
    );

    container.appendChild(placeholder);
    return;
  }

  const img = document.createElement("img");

  img.className = "club-logo";
  img.src = logoUrl;
  img.alt = "Originalwappen " + teamName;

  img.onerror = function () {
    const placeholder = create(
      "div",
      "logo-placeholder",
      "Wappen nicht geladen"
    );

    img.replaceWith(placeholder);
  };

  container.appendChild(img);
}

function createClub(teamName) {
  const club = create("div", "club");

  addLogo(club, teamName);

  club.appendChild(
    create("div", "club-name", teamName)
  );

  return club;
}

function createReportLink(spiel, className) {
  if (!spiel.spielbericht) {
    return null;
  }

  let url;

  try {
    url = new URL(spiel.spielbericht);
  } catch (error) {
    return null;
  }

  if (url.protocol !== "https:" &&
      url.protocol !== "http:") {
    return null;
  }

  const link = create(
    "a",
    className,
    "Spielbericht ansehen"
  );

  link.href = url.href;
  link.target = "_blank";
  link.rel = "noopener noreferrer";

  return link;
}

function showLatest(spiel) {
  const container = document.getElementById("latest");

  container.className = "latest";
  container.replaceChildren();

  container.appendChild(
    create("div", "label", "LETZTES LIGASPIEL")
  );

  container.appendChild(
    create("div", "match-date", spiel.datum)
  );

  const board = create("div", "scoreboard");

  board.appendChild(createClub(spiel.heim));

  board.appendChild(
    create("div", "score", spiel.ergebnis)
  );

  board.appendChild(createClub(spiel.gast));

  container.appendChild(board);

  const link = createReportLink(
    spiel,
    "report-link"
  );

  if (link) {
    container.appendChild(link);
  }
}

function showHistory(spiele) {
  const container = document.getElementById("history");
  container.replaceChildren();

  if (spiele.length === 0) {
    container.appendChild(
      create(
        "div",
        "status",
        "Noch keine weiteren Spielergebnisse."
      )
    );
    return;
  }

  for (const spiel of spiele) {
    const item = create("div", "history-item");

    const top = create("div", "history-top");

    top.appendChild(
      create("span", "history-date", spiel.datum)
    );

    top.appendChild(
      create("span", "history-score", spiel.ergebnis)
    );

    item.appendChild(top);

    item.appendChild(
      create(
        "div",
        "history-teams",
        spiel.heim + " – " + spiel.gast
      )
    );

    const link = createReportLink(
      spiel,
      "history-link"
    );

    if (link) {
      item.appendChild(link);
    }

    container.appendChild(item);
  }
}

async function loadResults() {
  const latest = document.getElementById("latest");

  try {
    const response = await fetch(
      DATA_URL,
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error(
        "Ergebnisdatei nicht erreichbar: " +
        response.status
      );
    }

    const data = await response.json();

    if (!Array.isArray(data.spiele)) {
      throw new Error("Ungültige Ergebnisdaten");
    }

    const spiele = data.spiele
      .filter(function (spiel) {
        return spiel &&
          spiel.datum_iso &&
          spiel.heim &&
          spiel.gast &&
          spiel.ergebnis;
      })
      .sort(function (a, b) {
        return b.datum_iso.localeCompare(a.datum_iso);
      });

    if (spiele.length === 0) {
      latest.textContent =
        "Noch keine abgeschlossenen Ligaspiele.";
      return;
    }

    showLatest(spiele[0]);
    showHistory(spiele.slice(1));

    if (data.stand) {
      const date = new Date(data.stand);

      if (!isNaN(date.getTime())) {
        document.getElementById("footer").textContent =
          "Datenstand: " +
          date.toLocaleString("de-DE");
      }
    }

  } catch (error) {
    latest.textContent =
      "Die Spielergebnisse konnten nicht geladen werden.";

    console.error("Dart Lions Ergebnisfehler:", error);
  }
}

loadResults();
</script>

</body>
</html>
