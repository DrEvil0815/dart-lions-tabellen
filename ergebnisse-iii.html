
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dart Lions III – Spielplan und Ergebnisse</title>

<style>
:root {
  --bg: #121827;
  --card: #252d3d;
  --gold: #d5a53b;
  --gold-light: #f0c45a;
  --text: #ffffff;
  --muted: #b9c5d5;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px 16px;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

.container {
  max-width: 1050px;
  margin: auto;
}

h1 {
  color: var(--gold);
  text-align: center;
  font-size: clamp(24px, 4vw, 36px);
  margin: 0 0 12px;
}

.subtitle {
  text-align: center;
  color: var(--muted);
  margin-bottom: 32px;
}

h2 {
  color: var(--gold);
  font-size: 22px;
  margin: 32px 0 18px;
}

/* Karten */

.match-card {
  padding: 28px 18px;
  margin-bottom: 25px;
  border-radius: 16px;
  background: linear-gradient(135deg, #293244, #1a2030);
  border: 1px solid #876628;
}

.next-card {
  border: 2px solid var(--gold);
  background: linear-gradient(135deg, #332c22, #1a2232);
}

.card-label {
  text-align: center;
  color: var(--gold-light);
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 2px;
}

.card-date {
  text-align: center;
  margin-top: 12px;
  color: var(--muted);
  font-size: 16px;
}

/* Mannschaften */

.scoreboard {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: 14px;
  margin: 28px 0 20px;
}

.club {
  text-align: center;
  min-width: 0;
}

.club-logo {
  display: block;
  width: 95px;
  height: 95px;
  object-fit: contain;
  margin: 0 auto 15px;
}

.logo-placeholder {
  width: 95px;
  height: 95px;
  border: 1px solid #667184;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  margin: 0 auto 15px;
  color: var(--muted);
  font-size: 12px;
  padding: 7px;
}

.club-name {
  font-weight: bold;
  font-size: 17px;
  overflow-wrap: anywhere;
}

.score {
  color: var(--gold-light);
  font-size: clamp(33px, 6vw, 60px);
  font-weight: 900;
  white-space: nowrap;
}

.vs {
  font-size: clamp(27px, 5vw, 46px);
}

.match-time {
  text-align: center;
  color: var(--gold-light);
  font-weight: bold;
  font-size: 19px;
  margin-top: 14px;
}

.report-link {
  display: block;
  text-align: center;
  color: var(--gold-light);
  text-decoration: none;
  font-weight: bold;
  margin-top: 20px;
}

.report-link:hover {
  text-decoration: underline;
}

/* Ältere Ergebnisse */

.history {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.history-item {
  background: var(--card);
  border-left: 4px solid var(--gold);
  border-radius: 11px;
  padding: 18px;
}

.history-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.history-date {
  color: var(--muted);
  font-size: 13px;
}

.history-score {
  color: var(--gold-light);
  font-size: 27px;
  font-weight: bold;
}

.history-teams {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin: 16px 0;
}

.history-club {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.history-club .club-logo,
.history-club .logo-placeholder {
  width: 50px;
  height: 50px;
  margin: 0;
  flex-shrink: 0;
}

.history-club .logo-placeholder {
  font-size: 8px;
}

.history-club .club-name {
  font-size: 14px;
  text-align: left;
}

.history-link {
  color: var(--gold-light);
  font-size: 13px;
}

.status {
  text-align: center;
  color: var(--muted);
  padding: 22px;
}

.footer {
  color: #99a7ba;
  text-align: center;
  margin-top: 30px;
  font-size: 12px;
}

/* Smartphones */

@media(max-width: 600px) {

  body {
    padding: 15px 10px;
  }

  .match-card {
    padding: 22px 10px;
  }

  .scoreboard {
    gap: 5px;
  }

  .club-logo,
  .logo-placeholder {
    width: 60px;
    height: 60px;
  }

  .club-name {
    font-size: 12px;
  }

  .history-teams {
    gap: 8px;
  }

  .history-club {
    gap: 6px;
  }

  .history-club .club-logo,
  .history-club .logo-placeholder {
    width: 35px;
    height: 35px;
  }

  .history-club .club-name {
    font-size: 11px;
  }

}
</style>
</head>

<body>

<div class="container">

  <h1>DART LIONS GRÄFENBERG III</h1>

  <p class="subtitle">
    Spielplan &amp; Ligaergebnisse – Saison 2026/27
  </p>

  <!-- Nächstes Ligaspiel -->

  <div id="next-match"></div>

  <!-- Letztes Ligaspiel -->

  <h2>LETZTES LIGASPIEL</h2>

  <div id="latest" class="status">
    Spielergebnisse werden geladen ...
  </div>

  <!-- Alle älteren Ergebnisse -->

  <h2>WEITERE SPIELERGEBNISSE</h2>

  <div id="history" class="history"></div>

  <div id="footer" class="footer"></div>

</div>

<script>
"use strict";

/* Automatisch aktualisierte NuLiga-Daten */

const DATA_URL = "./data/ergebnisse-iii.json";

/* ORIGINALWAPPEN ALLER MANNSCHAFTEN */

const LOGOS = {

  "Dart Lions Gräfenberg III":
    "./logos/dart-lions.PNG",

  "Bollnberch Bomber Maigisch II":
    "./logos/bollnberch.png",

  "Dartclub Steinbach":
    "./logos/steinbach.png",

  "DC Gallier Pettensiedel":
    "./logos/pettensiedel.png",

  "SV Hetzles II":
    "./logos/hetzles.png",

  'DJK "Creek Steelers" Wimmelbach IV':
    "./logos/wimmelbach.png",

  "Spickersportclub Pinzberg":
    "./logos/pinzberg.jpg",

  "DC Full Bulls Neunkirchen":
    "./logos/neunkirchen.png"

};

/* Hilfsfunktion für HTML-Elemente */

function create(tag, className, text) {
  const element = document.createElement(tag);

  if (className) {
    element.className = className;
  }

  if (text !== undefined && text !== null) {
    element.textContent = String(text);
  }

  return element;
}

/* Originalwappen einsetzen */

function addLogo(container, teamName) {

  const logoUrl = LOGOS[teamName];

  if (!logoUrl) {
    container.appendChild(
      create("div", "logo-placeholder", "Vereinswappen")
    );
    return;
  }

  const image = document.createElement("img");

  image.className = "club-logo";
  image.src = logoUrl;
  image.alt = "Wappen " + teamName;
  image.loading = "lazy";

  image.onerror = function() {
    const placeholder = create(
      "div",
      "logo-placeholder",
      "Wappen nicht geladen"
    );

    image.replaceWith(placeholder);
  };

  container.appendChild(image);
}

/* Mannschaft erstellen */

function createClub(teamName, compact = false) {

  const club = create(
    "div",
    compact ? "history-club" : "club"
  );

  addLogo(club, teamName);

  club.appendChild(
    create("div", "club-name", teamName)
  );

  return club;
}

/* Spielbericht-Link */

function createReportLink(spiel, className) {

  if (!spiel.spielbericht) {
    return null;
  }

  let url;

  try {
    url = new URL(spiel.spielbericht);
  } catch(error) {
    return null;
  }

  if (!["http:", "https:"].includes(url.protocol)) {
    return null;
  }

  const link = create(
    "a",
    className,
    "Spielbericht ansehen"
  );

  link.href = url.href;
  link.target = "_blank";
  link.rel = "noopener noreferrer";

  return link;
}

/* Nächstes Ligaspiel */

function showNextMatch(spiel) {

  const container = document.getElementById(
    "next-match"
  );

  container.replaceChildren();

  if (!spiel || !spiel.heim || !spiel.gast) {
    return;
  }

  const card = create("div", "match-card next-card");

  card.appendChild(
    create("div", "card-label", "NÄCHSTES LIGASPIEL")
  );

  card.appendChild(
    create("div", "card-date", spiel.datum)
  );

  const board = create("div", "scoreboard");

  board.appendChild(createClub(spiel.heim));

  board.appendChild(
    create("div", "score vs", "VS")
  );

  board.appendChild(createClub(spiel.gast));

  card.appendChild(board);

  if (spiel.uhrzeit) {
    card.appendChild(
      create(
        "div",
        "match-time",
        "Spielbeginn: " + spiel.uhrzeit
      )
    );
  }

  container.appendChild(card);
}

/* Letztes abgeschlossenes Spiel */

function showLatest(spiel) {

  const container = document.getElementById("latest");

  container.className = "match-card";
  container.replaceChildren();

  container.appendChild(
    create("div", "card-date", spiel.datum)
  );

  const board = create("div", "scoreboard");

  board.appendChild(createClub(spiel.heim));

  board.appendChild(
    create("div", "score", spiel.ergebnis)
  );

  board.appendChild(createClub(spiel.gast));

  container.appendChild(board);

  const report = createReportLink(
    spiel,
    "report-link"
  );

  if (report) {
    container.appendChild(report);
  }
}

/* Alle älteren Spielergebnisse */

function showHistory(spiele) {

  const container = document.getElementById(
    "history"
  );

  container.replaceChildren();

  if (!spiele.length) {
    container.appendChild(
      create(
        "div",
        "status",
        "Noch keine weiteren Spielergebnisse."
      )
    );
    return;
  }

  for (const spiel of spiele) {

    const item = create("div", "history-item");

    const header = create("div", "history-header");

    header.appendChild(
      create("span", "history-date", spiel.datum)
    );

    header.appendChild(
      create("span", "history-score", spiel.ergebnis)
    );

    item.appendChild(header);

    const teams = create("div", "history-teams");

    teams.appendChild(
      createClub(spiel.heim, true)
    );

    teams.appendChild(
      createClub(spiel.gast, true)
    );

    item.appendChild(teams);

    const report = createReportLink(
      spiel,
      "history-link"
    );

    if (report) {
      item.appendChild(report);
    }

    container.appendChild(item);
  }
}

/* Daten automatisch laden */

async function loadResults() {

  const latest = document.getElementById("latest");

  try {

    const response = await fetch(
      DATA_URL,
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error(
        "JSON-Datei nicht erreichbar: " +
        response.status
      );
    }

    const data = await response.json();

    if (!Array.isArray(data.spiele)) {
      throw new Error("Ungültige Ergebnisdaten");
    }

    /* Vorschau aus NuLiga */

    showNextMatch(data.naechstes_spiel);

    /* Fertige Spiele sortieren */

    const spiele = data.spiele
      .filter(function(spiel) {
        return spiel &&
          spiel.datum_iso &&
          spiel.heim &&
          spiel.gast &&
          spiel.ergebnis;
      })
      .sort(function(a, b) {
        return b.datum_iso.localeCompare(a.datum_iso);
      });

    if (spiele.length > 0) {

      showLatest(spiele[0]);

      showHistory(spiele.slice(1));

    } else {

      latest.textContent =
        "Noch keine abgeschlossenen Ligaspiele.";

      showHistory([]);
    }

    /* Letzter Datenabruf */

    if (data.stand) {

      const date = new Date(data.stand);

      if (!isNaN(date.getTime())) {

        document.getElementById(
          "footer"
        ).textContent =
          "Datenstand: " +
          date.toLocaleString("de-DE", {
            timeZone: "Europe/Berlin"
          });

      }
    }

  } catch(error) {

    latest.textContent =
      "Spielergebnisse momentan nicht verfügbar.";

    console.error(
      "Dart Lions III – Ladefehler:",
      error
    );
  }
}

/* Start */

loadResults();

</script>

</body>
</html>
