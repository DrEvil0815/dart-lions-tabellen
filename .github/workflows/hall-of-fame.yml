
name: Dart Lions Hall of Fame aktualisieren

on:
  workflow_dispatch:

  schedule:
    # Freitag, Samstag, Sonntag: alle 30 Minuten
    - cron: "*/30 * * * 5,6,0"

    # Montag bis Donnerstag: täglich
    - cron: "17 7 * * 1-4"

permissions:
  contents: write

concurrency:
  group: dart-lions-hall-of-fame
  cancel-in-progress: false

jobs:
  hall-of-fame:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install requests

      - name: Darthelfer-Daten aktualisieren
        run: python update_hall_of_fame.py

      - name: Statistiken kontrollieren
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/hall-of-fame.json")

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          competitions = data.get(
              "ausgewertete_competitions", 0
          )
          finals = data.get("finals_erkannt", 0)
          errors = data.get("fehleranzahl", 0)
          duplicates = len(
              data.get("moegliche_doppelprofile", [])
          )
          unmatched = len(
              data.get(
                  "nicht_zugeordnete_statistiken", []
              )
          )

          print("=== DART LIONS HALL OF FAME ===")
          print("Competitions:", competitions)
          print("Erkannte Sieger:", finals)
          print("Abruffehler:", errors)
          print("Doppelprofile:", duplicates)
          print("Unvollstaendige Zuordnungen:", unmatched)

          if competitions < 42:
              raise RuntimeError(
                  "Zu wenige Competitions erfasst"
              )

          if finals < 41:
              raise RuntimeError(
                  "Zu wenige Finals erkannt"
              )

          if errors:
              raise RuntimeError(
                  "Fehler beim Datenabruf"
              )

          if duplicates or unmatched:
              raise RuntimeError(
                  "Spielerzuordnungen pruefen"
              )

          print("Statistikpruefung erfolgreich.")
          PY

      - name: Aktualisierte Daten speichern
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/hall-of-fame.json

          if git diff --cached --quiet; then
            echo "Keine Aenderungen vorhanden."
          else
            git commit -m "Hall of Fame automatisch aktualisiert"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
