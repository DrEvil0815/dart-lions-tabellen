
name: Live Arena - Veranstaltungen

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install requests beautifulsoup4

      - name: Veranstaltungen aktualisieren
        run: python update_events.py

      - name: Daten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arena-events.json
          git diff --cached --quiet || (git commit -m "Aktualisiere Arena-Termine" && git push)
