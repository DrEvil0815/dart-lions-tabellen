
name: Ergebnisse Dart Lions III testen

on:
  workflow_dispatch:

jobs:
  pruefen:
    runs-on: ubuntu-latest

    steps:
      - name: Mannschaftsportrait herunterladen
        run: |
          curl -f -L --retry 2 \
            --max-time 40 \
            -A "Mozilla/5.0" \
            -o mannschaft-iii.html \
            "https://bdv-dart.liga.nu/cgi-bin/WebObjects/nuLigaDARTDE.woa/wa/teamPortrait?teamtable=1528157&championship=OFr+2026%2F27&group=211415"

          test -s mannschaft-iii.html

          echo "Dateigroesse:"
          wc -c mannschaft-iii.html

          echo "Pruefe Mannschaft:"
          grep -oi "Dart Lions Gräfenberg III" \
            mannschaft-iii.html | head -1 || true

      - name: Testdatei bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: mannschaft-dart-lions-iii
          path: mannschaft-iii.html
