
name: Darthelfer Hall of Fame testen

on:
  workflow_dispatch:

jobs:
  darthelfer-test:
    runs-on: ubuntu-latest

    steps:
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Requests installieren
        run: pip install requests

      - name: Spielerzuordnung untersuchen
        shell: bash
        run: |
          python - <<'PY'
          import requests

          url = (
              "https://www.darthelfer.de/api/public/"
              "tournament/"
              "d9943c19-41a5-4630-9d95-4d5543b97bf2"
          )

          r = requests.get(
              url,
              timeout=40,
              headers={"Accept": "application/json"}
          )
          r.raise_for_status()
          data = r.json()

          main = data.get("turnierMain") or {}
          wrapper = data.get("ranglisteWrapper") or {}

          players = (
              main.get("tournamentPlayerEntities") or []
          )

          stats = wrapper.get("playerStatistiks") or []
          maximums = wrapper.get("rangliste180er") or []

          print("=== SPIELERZUORDNUNG ===")
          print("Spieler:", len(players))
          print("Statistiken:", len(stats))

          if players:
              print("\nSPIELERFELDER:")
              print(list(players[0].keys()))

          def safe_fields(obj):
              result = {}
              for key, value in obj.items():
                  k = key.lower()

                  if any(x in k for x in [
                      "name", "vorname", "nachname",
                      "playerid", "userid",
                      "spielerid", "platz"
                  ]) or k == "id":
                      if isinstance(value, (
                          str, int, float, bool
                      )):
                          result[key] = value

              return result

          print("\nSPIELERBEISPIELE:")
          for player in players[:5]:
              print(safe_fields(player))

          print("\nSTATISTIK-BEISPIELE:")
          for stat in stats[:3]:
              print({
                  "id": stat.get("id"),
                  "playerid": stat.get("playerid"),
                  "userid": stat.get("userid"),
                  "180er": stat.get("_180er"),
                  "average": stat.get("average")
              })

          print("\n180ER-RANGLISTE:")
          for item in maximums:
              print({
                  "id": item.get("id"),
                  "anzahl": item.get("anzahl")
              })

          print("\nPLATZIERUNGSFELDER:")
          for key in main:
              if any(x in key.lower() for x in [
                  "platz", "rang", "ergebnis"
              ]):
                  value = main[key]
                  if isinstance(value, list):
                      print(key, "Eintraege:", len(value))
                      if value and isinstance(value[0], dict):
                          print(
                              "Felder:",
                              list(value[0].keys())
                          )
                  else:
                      print(key, "Typ:", type(value).__name__)

          print("\nTEST ABGESCHLOSSEN")
          PY
