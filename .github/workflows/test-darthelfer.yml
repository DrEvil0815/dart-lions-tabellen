
name: Darthelfer Hall of Fame testen

on:
  workflow_dispatch:

jobs:
  darthelfer-test:
    runs-on: ubuntu-latest

    steps:
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Requests installieren
        run: pip install requests

      - name: Spieler und Statistiken untersuchen
        shell: bash
        run: |
          python - <<'PY'
          import requests

          URL = (
              "https://www.darthelfer.de/api/public/tournament/"
              "d9943c19-41a5-4630-9d95-4d5543b97bf2"
          )

          response = requests.get(
              URL,
              timeout=40,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/json"
              }
          )
          response.raise_for_status()
          data = response.json()

          def inspect(label, value):
              print("\n=== " + label + " ===")

              if value is None:
                  print("Keine Daten")
                  return

              if isinstance(value, dict):
                  print("Felder:", list(value.keys())[:60])

                  for key in list(value.keys())[:20]:
                      item = value[key]

                      if isinstance(item, list):
                          print(key, "- Liste:", len(item))
                          if item and isinstance(item[0], dict):
                              print("  Eintragsfelder:",
                                    list(item[0].keys())[:40])

                      elif isinstance(item, dict):
                          print(key, "- Objektfelder:",
                                list(item.keys())[:30])

              elif isinstance(value, list):
                  print("Eintraege:", len(value))
                  if value and isinstance(value[0], dict):
                      print("Felder:",
                            list(value[0].keys())[:60])
                      print("Beispiel:",
                            str(value[0])[:1000])

              else:
                  print(str(value)[:300])

          inspect(
              "RANGLISTEN",
              data.get("ranglisteWrapper")
          )

          wrapper = data.get("ranglisteWrapper") or {}

          for field in [
              "rangliste180er",
              "rangliste171er",
              "ranglisteHighfinishes",
              "lowDarts",
              "playerStatistiks",
              "ranglisteAverage"
          ]:
              inspect(
                  "STATISTIK " + field,
                  wrapper.get(field)
              )

          inspect(
              "BESTPLATZIERTE",
              data.get("bestplatzierteDtos")
          )

          inspect(
              "KO-TURNIER",
              data.get("modelKO")
          )

          inspect(
              "TURNIER-SPIELE",
              data.get("tournamentGames")
          )

          main = data.get("turnierMain") or {}

          print("\n=== RELEVANTE TURNIERFELDER ===")
          for key in main:
              if any(term in key.lower() for term in [
                  "platz", "rang", "teilnehmer",
                  "spieler", "player", "ergebnis",
                  "bezeichnung", "beginn", "status"
              ]):
                  value = main[key]
                  print(key, ":", str(value)[:250])

          print("\nTEST ABGESCHLOSSEN")
          PY
