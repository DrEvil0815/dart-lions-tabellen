
name: Darthelfer Hall of Fame testen

on:
  workflow_dispatch:

jobs:
  sonderfall-test:
    runs-on: ubuntu-latest

    steps:
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Requests installieren
        run: pip install requests

      - name: Zehnte Steeldart Competition untersuchen
        shell: bash
        run: |
          python - <<'PY'
          import requests

          ID = "ddcec65f-33e5-438f-80a0-94f9c8019e5d"

          url = (
              "https://www.darthelfer.de/api/public/"
              "tournament/" + ID
          )

          response = requests.get(url, timeout=45)
          response.raise_for_status()
          data = response.json()

          main = data.get("turnierMain") or {}
          ko = data.get("turnierKO") or {}

          print("=== TURNIER ===")
          print("Name:", main.get("bezeichnung"))
          print("Datum:", main.get("beginnString"))
          print("Status:", main.get("tournamentstatus"))

          print("\n=== TURNIERPHASEN ===")
          for key in [
              "turnierMain",
              "turnierGruppe",
              "turnierKO",
              "turnierBronze",
              "turnierSilber"
          ]:
              phase = data.get(key)
              if isinstance(phase, dict):
                  print(
                      key,
                      "| Name:", phase.get("bezeichnung"),
                      "| Modus:",
                      phase.get("tournamentModus"),
                      "| Ergebnisse:",
                      len(
                          phase.get(
                              "tournamentErgebnisEntities"
                          ) or []
                      )
                  )
              else:
                  print(key, "| Nicht vorhanden")

          print("\n=== KO-SPIELPLAN ===")
          for node in data.get("modelKO") or []:
              print({
                  "feld": node.get("feld"),
                  "finale": node.get("finale"),
                  "endknoten": node.get("endknoten"),
                  "child": node.get("child")
              })

          players = (
              ko.get("tournamentPlayerEntities") or []
          )

          names = {
              p["id"]: p.get("name", "Unbekannt")
              for p in players
              if p.get("id")
          }

          print("\n=== KO-ERGEBNISSE ===")
          for game in (
              ko.get("tournamentErgebnisEntities") or []
          ):
              print(
                  "Feld:", game.get("feld"),
                  "|",
                  names.get(
                      game.get("spieler1Id"),
                      "Unbekannt"
                  ),
                  game.get("anzahlSpieler1"),
                  ":",
                  game.get("anzahlSpieler2"),
                  names.get(
                      game.get("spieler2Id"),
                      "Unbekannt"
                  )
              )

          print("\n=== BESTPLATZIERTE ===")
          for item in data.get("bestplatzierteDtos") or []:
              if isinstance(item, dict):
                  print({
                      key: value
                      for key, value in item.items()
                      if isinstance(
                          value, (str, int, float, bool)
                      )
                  })

          print("\n=== TEST ABGESCHLOSSEN ===")
          PY
