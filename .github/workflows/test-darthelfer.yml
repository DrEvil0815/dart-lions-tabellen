
name: Darthelfer Hall of Fame testen

on:
  workflow_dispatch:

jobs:
  darthelfer-test:
    runs-on: ubuntu-latest

    steps:
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Requests installieren
        run: pip install requests

      - name: KO und Platzierungen untersuchen
        shell: bash
        run: |
          python - <<'PY'
          import requests

          ID = "d9943c19-41a5-4630-9d95-4d5543b97bf2"
          URL = (
              "https://www.darthelfer.de/api/public/tournament/"
              + ID
          )

          response = requests.get(
              URL,
              timeout=45,
              headers={"Accept": "application/json"}
          )
          response.raise_for_status()
          data = response.json()

          def overview(title, obj):
              print("\n=== " + title + " ===")

              if not isinstance(obj, dict):
                  print("Kein Objekt")
                  return

              for key, value in obj.items():
                  if isinstance(value, list):
                      print(key, "= LISTE", len(value))
                  elif isinstance(value, dict):
                      print(key, "= OBJEKT")
                  elif value is not None:
                      if any(x in key.lower() for x in [
                          "platz", "rang", "status",
                          "bezeichnung", "sieger"
                      ]):
                          print(key, "=", str(value)[:100])

          def sample(title, items):
              print("\n=== " + title + " ===")

              if not isinstance(items, list):
                  print("Keine Liste")
                  return

              print("Eintraege:", len(items))

              for item in items[:2]:
                  if not isinstance(item, dict):
                      print(type(item).__name__)
                      continue

                  print("Felder:", list(item.keys()))

                  # Nur turnierrelevante Werte ausgeben,
                  # keine Kontaktdaten der Spieler.
                  for key, value in item.items():
                      lower = key.lower()

                      if any(x in lower for x in [
                          "platz", "rang", "player",
                          "spieler", "game", "punkt",
                          "score", "name", "sieger",
                          "gewonnen", "verloren",
                          "status", "feld", "runde"
                      ]):
                          if isinstance(value, (
                              str, int, float, bool
                          )) or value is None:
                              print(
                                  " ", key, "=",
                                  str(value)[:150]
                              )
                          elif isinstance(value, list):
                              print(
                                  " ", key,
                                  "= Liste", len(value)
                              )
                          elif isinstance(value, dict):
                              print(
                                  " ", key,
                                  "= Objektfelder",
                                  list(value.keys())[:20]
                              )

          main = data.get("turnierMain") or {}
          ko = data.get("turnierKO") or {}

          print("=== TURNIER ===")
          print("Name:", main.get("bezeichnung"))
          print("Status:", main.get("tournamentstatus"))
          print("KO-Name:", ko.get("bezeichnung"))

          overview("KO-DATENFELDER", ko)

          for title, obj in [
              ("HAUPTTURNIER", main),
              ("KO-TURNIER", ko)
          ]:
              print("\n=== " + title + ": RELEVANTE LISTEN ===")

              for key, value in obj.items():
                  if isinstance(value, list) and any(
                      term in key.lower()
                      for term in [
                          "game", "spiel", "ergebnis",
                          "platz", "rang", "ko",
                          "runde", "best"
                      ]
                  ):
                      sample(title + " / " + key, value)

          sample(
              "KO-BAUM",
              data.get("modelKO")
          )

          sample(
              "TURNIER-SPIELE",
              data.get("tournamentGames")
          )

          sample(
              "GRUPPENTABELLEN",
              data.get("gruppenTabellen")
          )

          sample(
              "BESTPLATZIERTE",
              data.get("bestplatzierteDtos")
          )

          print("\n=== TEST ABGESCHLOSSEN ===")
          PY
