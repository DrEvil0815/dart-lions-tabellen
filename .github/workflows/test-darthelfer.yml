
name: Darthelfer Hall of Fame testen

on:
  workflow_dispatch:

jobs:
  darthelfer-test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Requests installieren
        run: pip install requests

      - name: Finale und Platzierungen untersuchen
        shell: bash
        run: |
          python - <<'PY'
          import requests

          ID = "d9943c19-41a5-4630-9d95-4d5543b97bf2"
          URL = (
              "https://www.darthelfer.de/api/public/tournament/"
              + ID
          )

          response = requests.get(
              URL,
              timeout=45,
              headers={"Accept": "application/json"}
          )
          response.raise_for_status()

          data = response.json()
          ko = data.get("turnierKO") or {}

          players = ko.get(
              "tournamentPlayerEntities"
          ) or []

          games = ko.get(
              "tournamentErgebnisEntities"
          ) or []

          model = data.get("modelKO") or []

          names = {
              p["id"]: p.get("name", "Unbekannt")
              for p in players
              if p.get("id")
          }

          print("=== KO-TEILNEHMER ===")
          for player in players:
              print(
                  player.get("id"),
                  "|",
                  player.get("name"),
                  "| Gruppen-ID:",
                  player.get("playerIdAusGruppenphase")
              )

          print("\n=== KO-SPIELPLAN ===")

          for node in model:
              print(
                  "Feld:", node.get("feld"),
                  "| Finale:", node.get("finale"),
                  "| Platz 3:",
                  node.get("beschreibungUnten"),
                  "| Kind:", node.get("child"),
                  "| Endknoten:", node.get("endknoten"),
                  "| Eltern:",
                  node.get("parent1"),
                  node.get("parent2")
              )

          print("\n=== ALLE KO-ERGEBNISSE ===")

          for game in games:
              id1 = game.get("spieler1Id")
              id2 = game.get("spieler2Id")

              name1 = names.get(id1, "Unbekannt")
              name2 = names.get(id2, "Unbekannt")

              score1 = game.get("anzahlSpieler1")
              score2 = game.get("anzahlSpieler2")

              print(
                  "Feld:", game.get("feld"),
                  "|",
                  name1,
                  score1,
                  ":",
                  score2,
                  name2
              )

          print("\n=== KONTROLLERGEBNIS ===")
          print("Erwarteter Sieger: Maurice Baum")
          print(
              "Erwarteter Zweiter:",
              "Preißinger Alexander"
          )
          print(
              "Erwarteter Dritter:",
              "Sandro Eisenreich"
          )

          print("\nTEST ABGESCHLOSSEN")
          PY
