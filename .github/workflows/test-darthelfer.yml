
name: Darthelfer Hall of Fame testen

on:
  workflow_dispatch:

jobs:
  darthelfer-test:
    runs-on: ubuntu-latest

    steps:
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Requests installieren
        run: pip install requests

      - name: Darthelfer-Daten untersuchen
        shell: bash
        run: |
          python - <<'PY'
          import requests
          import re

          BASE = "https://www.darthelfer.de/api/public"

          OPERATOR = (
              "7a088d28-63ee-49ac-a1fc-fe726056ddbe"
          )

          TEST_TOURNAMENT = (
              "d9943c19-41a5-4630-9d95-4d5543b97bf2"
          )

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json"
          })

          def fetch(url):
              response = session.get(url, timeout=40)
              response.raise_for_status()
              return response.json()

          print("=== DART LIONS HALL OF FAME TEST ===")

          data = fetch(
              BASE + "/eventoperator/" + OPERATOR
          )

          print("\nVERANSTALTER:")
          print(data.get("eventoperatorBezeichnung"))

          print("\nVERFUEGBARE DATENFELDER:")
          print(list(data.keys()))

          events = []
          for key, value in data.items():
              if "tournament" in key.lower():
                  if isinstance(value, list):
                      events.extend(
                          item for item in value
                          if isinstance(item, dict)
                      )

          unique = {
              item.get("id"): item
              for item in events
              if item.get("id")
          }

          competitions = [
              item for item in unique.values()
              if re.search(
                  r"\bcompetition\b",
                  str(item.get("bezeichnung", "")),
                  re.IGNORECASE
              )
              and not re.search(
                  r"kids|jugend",
                  str(item.get("bezeichnung", "")),
                  re.IGNORECASE
              )
          ]

          print("\nALLE GEFUNDENEN EVENTS:")
          print(len(unique))

          print("\nREGULAERE COMPETITIONS:")
          print(len(competitions))

          print("\nCOMPETITION-LISTE:")
          for item in competitions:
              print(
                  item.get("bezeichnung"),
                  "| ID:",
                  item.get("id")
              )

          print("\n=== TURNIERDETAILS TEST ===")

          tournament = fetch(
              BASE + "/tournament/" + TEST_TOURNAMENT
          )

          if isinstance(tournament, dict):
              print("\nOBERSTE DATENFELDER:")
              print(list(tournament.keys()))

              print("\nSTRUKTUR DER DATEN:")
              for key, value in tournament.items():
                  if isinstance(value, list):
                      print(
                          key,
                          "| Liste mit",
                          len(value),
                          "Eintraegen"
                      )
                      if value and isinstance(value[0], dict):
                          print(
                              "  Felder:",
                              list(value[0].keys())[:40]
                          )

                  elif isinstance(value, dict):
                      print(
                          key,
                          "| Objekt mit Feldern:",
                          list(value.keys())[:40]
                      )

                  else:
                      print(
                          key,
                          "|",
                          str(value)[:100]
                      )
          else:
              print(
                  "Antworttyp:",
                  type(tournament).__name__
              )

          print("\n=== TEST ABGESCHLOSSEN ===")
          PY
