
name: NuLiga Tabellen aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: write

jobs:
  abrufen:
    runs-on: ubuntu-latest

    steps:
      - name: Dateien laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests beautifulsoup4



      - name: Ligatabellen und Ergebnisse aktualisieren
        run: |
          python update_table.py
          python update_table_i.py
          python update_table_iii.py
          python update_ergebnisse_iii.py



      - name: Neue Daten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          
          git add data/dart-lions-i.json data/dart-lions-ii.json data/dart-lions-iii.json data/ergebnisse-iii.json



          if ! git diff --cached --quiet; then
            git commit -m "NuLiga-Tabelle aktualisieren"
            git push
          else
            echo "Keine Änderungen"
          fi
