
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dart Lions I – Spielplan und Ergebnisse</title>
<style>
:root{
  --bg:#121827;
  --card:#252d3d;
  --gold:#d5a53b;
  --light:#f0c45a;
  --muted:#b9c5d5;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:10px 7px;
  background:var(--bg);
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
.container{
  max-width:680px;
  margin:0 auto;
}
h1{
  color:var(--gold);
  font-size:clamp(17px,4vw,23px);
  text-align:center;
  margin:5px 0 7px;
}
.subtitle{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin:0 0 18px;
}
h2{
  color:var(--gold);
  font-size:15px;
  margin:20px 0 10px;
}
.match-card{
  background:linear-gradient(135deg,#293244,#1a2030);
  border:1px solid #876628;
  border-radius:12px;
  padding:16px 12px;
  margin-bottom:15px;
}
.next-card{
  padding:11px 10px;
  border-color:var(--gold);
  background:linear-gradient(135deg,#2c2b28,#1b2231);
}
.card-label{
  color:var(--light);
  font-weight:bold;
  font-size:11px;
  letter-spacing:1px;
  text-align:center;
}
.card-date,.history-date{
  color:var(--muted);
  font-size:12px;
  text-align:center;
  margin-top:7px;
}
.scoreboard{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;
  gap:8px;
  margin:16px 0 10px;
}
.club{
  min-width:0;
  text-align:center;
}
.club-logo,.logo-placeholder{
  width:64px;
  height:64px;
  display:block;
  margin:0 auto 8px;
}
.club-logo{object-fit:contain}
.logo-placeholder{
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #667184;
  border-radius:50%;
  color:var(--muted);
  font-size:9px;
  padding:5px;
}
.club-name{
  font-size:12px;
  font-weight:bold;
  line-height:1.3;
  overflow-wrap:anywhere;
}
.score{
  font-weight:900;
  font-size:clamp(28px,7vw,40px);
  color:var(--light);
  white-space:nowrap;
  text-align:center;
}
.next-card .scoreboard{margin:10px 0 6px}
.next-card .club-logo,
.next-card .logo-placeholder{
  width:43px;
  height:43px;
  margin-bottom:5px;
}
.next-card .club-name{font-size:11px}
.next-card .score{font-size:22px}
.match-time{
  color:var(--light);
  text-align:center;
  font-weight:bold;
  font-size:12px;
  margin-top:8px;
}
.latest-card .club-logo,
.latest-card .logo-placeholder{
  width:68px;
  height:68px;
}
.report-link{
  display:block;
  text-align:center;
  color:var(--light);
  font-size:12px;
  font-weight:bold;
  text-decoration:none;
  margin-top:12px;
}
.history{
  display:flex;
  flex-direction:column;
  gap:9px;
}
.history-item{
  background:var(--card);
  border-left:3px solid var(--gold);
  border-radius:9px;
  padding:12px 10px;
}
.history-item .scoreboard{
  margin:12px 0 8px;
}
.history-item .club-logo,
.history-item .logo-placeholder{
  width:43px;
  height:43px;
  margin-bottom:6px;
}
.history-item .club-name{font-size:11px}
.history-item .score{font-size:30px}
.history-item .report-link{
  font-size:11px;
  margin-top:8px;
}
.status{
  padding:18px 10px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}
.footer{
  text-align:center;
  color:#9ba8bb;
  font-size:10px;
  margin-top:18px;
}
@media(max-width:440px){
  body{padding:8px 5px}
  h1{font-size:18px}
  .match-card{padding:12px 7px}
  .scoreboard{gap:5px}
  .club-name{font-size:10px}
  .latest-card .club-logo,
  .latest-card .logo-placeholder{
    width:48px;height:48px;
  }
  .next-card .club-logo,
  .next-card .logo-placeholder{
    width:36px;height:36px;
  }
  .next-card .club-name{font-size:10px}
  .history-item .club-logo,
  .history-item .logo-placeholder{
    width:35px;height:35px;
  }
  .history-item .club-name{font-size:10px}
  .history-item .score{font-size:25px}
  .score{font-size:29px}
}
</style>
</head>
<body>

<div class="container">
  <h1>DART LIONS I</h1>
  <p class="subtitle">
    Spielplan &amp; Ergebnisse · Saison 2026/27
  </p>

  <div id="next-match"></div>

  <h2>LETZTES LIGASPIEL</h2>
  <div id="latest" class="status">
    Spielergebnisse werden geladen ...
  </div>

  <h2>WEITERE ERGEBNISSE</h2>
  <div id="history" class="history"></div>

  <div id="footer" class="footer"></div>
</div>

<script>
"use strict";

const DATA_URL="./data/ergebnisse-i.json";

/* Originalwappen – weitere Gegner später ergänzen */
const LOGOS={
  "Dart Lions Gräfenberg":"./logos/dart-lions.PNG",
  'DJK "Creek Steelers" Wimmelbach II':
    "./logos/wimmelbach.png",
  "Bollnberch Bomber Maigisch":
    "./logos/bollnberch.png"
};

function create(tag,cls,text){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(text!==undefined&&text!==null){
    e.textContent=String(text);
  }
  return e;
}

function addLogo(container,team){
  const url=LOGOS[team];

  if(!url){
    container.appendChild(
      create("div","logo-placeholder","Vereinswappen")
    );
    return;
  }

  const img=document.createElement("img");
  img.className="club-logo";
  img.src=url;
  img.alt="Originalwappen "+team;
  img.loading="lazy";

  img.onerror=function(){
    img.replaceWith(
      create("div","logo-placeholder","Wappen fehlt")
    );
  };
  container.appendChild(img);
}

function createClub(team){
  const club=create("div","club");
  addLogo(club,team);
  club.appendChild(create("div","club-name",team));
  return club;
}

function createLink(match){
  if(!match.spielbericht)return null;
  let url;
  try{
    url=new URL(match.spielbericht);
    if(!["https:","http:"].includes(url.protocol)){
      return null;
    }
  }catch(e){return null}

  const link=create(
    "a","report-link","Spielbericht ansehen"
  );
  link.href=url.href;
  link.target="_blank";
  link.rel="noopener noreferrer";
  return link;
}

function createBoard(match,middle){
  const board=create("div","scoreboard");
  board.appendChild(createClub(match.heim));
  board.appendChild(create("div","score",middle));
  board.appendChild(createClub(match.gast));
  return board;
}

function showNext(match){
  const container=document.getElementById("next-match");
  container.replaceChildren();

  if(!match||!match.heim||!match.gast)return;

  const card=create("div","match-card next-card");
  card.appendChild(
    create("div","card-label","NÄCHSTES LIGASPIEL")
  );
  card.appendChild(
    create("div","card-date",match.datum)
  );
  card.appendChild(createBoard(match,"VS"));

  if(match.uhrzeit){
    card.appendChild(
      create("div","match-time",
        "Spielbeginn: "+match.uhrzeit)
    );
  }
  container.appendChild(card);
}

function showLatest(match){
  const box=document.getElementById("latest");
  box.className="match-card latest-card";
  box.replaceChildren();

  box.appendChild(
    create("div","card-date",match.datum)
  );
  box.appendChild(createBoard(match,match.ergebnis));

  const link=createLink(match);
  if(link)box.appendChild(link);
}

function showHistory(matches){
  const box=document.getElementById("history");
  box.replaceChildren();

  if(!matches.length){
    box.appendChild(
      create("div","status","Noch keine weiteren Ergebnisse.")
    );
    return;
  }

  for(const match of matches){
    const card=create("div","history-item");

    card.appendChild(
      create("div","history-date",match.datum)
    );
    card.appendChild(
      createBoard(match,match.ergebnis)
    );

    const link=createLink(match);
    if(link)card.appendChild(link);
    box.appendChild(card);
  }
}

async function loadResults(){
  const latest=document.getElementById("latest");

  try{
    const response=await fetch(
      DATA_URL,{cache:"no-store"}
    );

    if(!response.ok){
      throw new Error("Ergebnisdatei nicht erreichbar");
    }

    const data=await response.json();

    if(!Array.isArray(data.spiele)){
      throw new Error("Ungültige Ergebnisdaten");
    }

    showNext(data.naechstes_spiel);

    const matches=data.spiele
      .filter(m=>m&&m.datum_iso&&m.heim&&
                 m.gast&&m.ergebnis)
      .sort((a,b)=>
        b.datum_iso.localeCompare(a.datum_iso)
      );

    if(matches.length){
      showLatest(matches[0]);
      showHistory(matches.slice(1));
    }else{
      latest.textContent="Noch keine abgeschlossenen Spiele.";
      showHistory([]);
    }

    if(data.stand){
      const date=new Date(data.stand);
      if(!isNaN(date.getTime())){
        document.getElementById("footer").textContent=
          "Datenstand: "+date.toLocaleString(
            "de-DE",{timeZone:"Europe/Berlin"}
          );
      }
    }
  }catch(error){
    latest.textContent=
      "Spielergebnisse momentan nicht verfügbar.";
    console.error("Dart Lions I:",error);
  }
}

loadResults();
</script>
</body>
</html>
